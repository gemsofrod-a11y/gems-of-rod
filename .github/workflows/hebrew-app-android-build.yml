name: Build Hebrew App APK

on:
  push:
    branches:
      - "**"
    paths:
      - "hebrew-app-android/**"
      - ".github/workflows/hebrew-app-android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hebrew-app-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-app-debug-apk
          path: hebrew-app-android/app/build/outputs/apk/debug/app-debug.apk

      # Les artefacts d'Actions sont stockés sur un domaine (Azure Blob) souvent
      # inaccessible depuis certains environnements réseau restreints. On publie
      # donc aussi l'APK comme asset d'une release GitHub (toujours mise à jour
      # sur le même tag), téléchargeable depuis github.com.
      - name: Publish APK to "latest debug build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hebrew-app-debug-latest
          name: "Apprendre l'hébreu — dernier build de debug"
          body: "APK de debug généré automatiquement depuis ${{ github.sha }}."
          files: hebrew-app-android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
