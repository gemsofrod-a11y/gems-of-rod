name: Build Hebrew App APK

on:
  push:
    branches:
      - "**"
    paths:
      - "hebrew-app-android/**"
      - ".github/workflows/hebrew-app-android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hebrew-app-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-app-debug-apk
          path: hebrew-app-android/app/build/outputs/apk/debug/app-debug.apk
