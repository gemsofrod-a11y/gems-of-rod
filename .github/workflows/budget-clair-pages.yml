name: Budget Clair (GitHub Pages)

# Publie l'appli Budget Clair (finances/) sur GitHub Pages à chaque fusion
# sur main : https://gemsofrod-a11y.github.io/gems-of-rod/finances/
# Gratuit et sans crédits, contrairement à Netlify. Seuls les fichiers de
# finances/ sont publiés (aucune donnée : l'appli lit les relevés dans le
# téléphone). Prérequis, une seule fois : Settings > Pages > Source =
# « GitHub Actions ».

on:
  push:
    branches:
      - main
    paths:
      - "finances/**"
      - ".github/workflows/budget-clair-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}finances/
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site/finances
          cp finances/index.html finances/sw.js finances/manifest.webmanifest finances/icon.svg _site/finances/
          # La racine renvoie vers l'appli.
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Budget Clair</title><meta http-equiv="refresh" content="0; url=finances/"><a href="finances/">Budget Clair</a>' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
