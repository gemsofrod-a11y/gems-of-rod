name: Facet demo video

# Vidéo explicative de l'atelier de facettage (bouton « Démo ») filmée image par
# image dans l'app compilée (Robolectric, FacetDemoVideoTest), assemblée en MP4
# et poussée sur la branche « facet-video » pour relecture avant d'être copiée
# dans res/raw/facet_demo.mp4.
on:
  workflow_dispatch: {}
  push:
    branches-ignore:
      - facet-video
      - facet-screenshots
    paths:
      - "android/app/src/test/java/fr/gemsofrod/encyclopedie/FacetDemoVideoTest.kt"
      - ".github/workflows/facet-demo-video.yml"

permissions:
  contents: write

concurrency:
  group: facet-demo-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Film the demo frames
        env:
          FACET_VIDEO: "1"
        run: ./gradlew :app:testDebugUnitTest --tests "fr.gemsofrod.encyclopedie.FacetDemoVideoTest" --no-daemon

      - name: Encode MP4
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          cd app/build/outputs/facet-video
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -i f%04d.png \
            -vf "scale=720:-2:flags=lanczos,format=yuv420p" -c:v libx264 -preset slow -crf 25 \
            -profile:v baseline -level 3.1 -movflags +faststart -an facet_demo.mp4
          ls -la facet_demo.mp4

      - name: Publish to branch facet-video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_SHA: ${{ github.sha }}
        run: |
          out="$RUNNER_TEMP/facet-video"
          rm -rf "$out" && mkdir -p "$out"
          src=app/build/outputs/facet-video
          cp "$src/facet_demo.mp4" "$src/frames.txt" "$out/"
          for f in 0020 0050 0100 0180 0270 0300 0340 0400 0440 0480; do cp "$src/f$f.png" "$out/" 2>/dev/null || true; done
          cd "$out"
          git init -q && git checkout -q -b facet-video
          git add . && git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Vidéo de démonstration de l'atelier ($SRC_SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:facet-video

      - name: Print test failure stack traces on failure
        if: failure()
        run: cat app/build/test-results/testDebugUnitTest/*.xml || true
