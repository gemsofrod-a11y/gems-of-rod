name: Build Android APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # `packages` explicite : le défaut de l'action inclut le paquet SDK
        # legacy "tools", retiré du dépôt Google (sdkmanager échoue avec
        # "Failed to find package 'tools'"). Seul platform-tools est
        # nécessaire ; AGP/Gradle installe lui-même les platform/build-tools.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs (encyclopédie + assistant vocal)
        run: ./gradlew :app:assembleDebug :assistant:assembleDebug --no-daemon

      - name: Upload APK encyclopédie
        uses: actions/upload-artifact@v4
        with:
          name: gems-of-rod-encyclopedie-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK assistant vocal
        uses: actions/upload-artifact@v4
        with:
          name: gems-of-rod-assistant-debug-apk
          path: android/assistant/build/outputs/apk/debug/assistant-debug.apk
