name: Build signed Android App Bundle (Play Store)

# Ne se déclenche jamais automatiquement sur un push : uniquement à la demande,
# une fois que les secrets de signature (ci-dessous) sont configurés dans les
# paramètres du dépôt (Settings > Secrets and variables > Actions).
#
# Secrets requis :
#   ANDROID_KEYSTORE_BASE64  -> contenu du fichier .jks encodé en base64
#                                (ex. `base64 -w0 gems-of-rod-upload.jks`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restaure le keystore depuis le secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > gems-of-rod-upload.jks

      - name: Build App Bundle signé (release)
        env:
          KEYSTORE_FILE: gems-of-rod-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Nettoie le keystore du runner
        if: always()
        run: rm -f gems-of-rod-upload.jks

      - name: Upload de l'App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: gems-of-rod-encyclopedie-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
