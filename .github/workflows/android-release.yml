name: Build signed Android App Bundle (Play Store)

# Ne se déclenche jamais automatiquement sur un push : uniquement à la demande,
# une fois que les secrets de signature (ci-dessous) sont configurés dans les
# paramètres du dépôt (Settings > Secrets and variables > Actions).
#
# Secrets requis :
#   ANDROID_KEYSTORE_BASE64  -> contenu du fichier .jks encodé en base64
#                                (ex. `base64 -w0 gems-of-rod-upload.jks`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restaure le keystore depuis le secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > gems-of-rod-upload.jks

      - name: Build App Bundle signé (release)
        env:
          KEYSTORE_FILE: gems-of-rod-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Nettoie le keystore du runner
        if: always()
        run: rm -f gems-of-rod-upload.jks

      # L'upload passe avant tout diagnostic annexe : un build signé produit
      # avec succès doit toujours être livrable, même si l'étape suivante
      # (best-effort) échoue.
      - name: Upload de l'App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: gems-of-rod-encyclopedie-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # À importer manuellement dans Play Console au moment de la création de
      # la release (bouton dédié à côté de l'import de l'AAB), pour que les
      # plantages du code natif (CameraX/Camera2) soient lisibles dans les
      # rapports au lieu de simples adresses mémoire.
      - name: Upload des symboles de débogage natifs
        uses: actions/upload-artifact@v4
        with:
          name: gems-of-rod-encyclopedie-native-debug-symbols
          path: android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn

      # Preuve directe sur l'artefact réellement produit (pas seulement sur
      # build.gradle.kts) : le sandbox de développement ne peut pas
      # télécharger les artefacts GitHub Actions (voir commentaire équivalent
      # dans screenshots.yml), donc on lit le manifeste ici et on l'imprime
      # dans les logs du job, consultables via l'API sans téléchargement.
      # continue-on-error : purement diagnostique, ne doit jamais bloquer la
      # livraison d'un AAB par ailleurs valide (ex. téléchargement de
      # bundletool échoué/corrompu — déjà arrivé une fois en pratique).
      - name: Vérifie le SDK cible réellement empaqueté dans l'AAB
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/latest/download/bundletool-all.jar
          echo "=== Manifeste du module base (app-release.aab) ==="
          java -jar /tmp/bundletool.jar dump manifest --bundle=app/build/outputs/bundle/release/app-release.aab
          echo "=== Ligne uses-sdk ==="
          java -jar /tmp/bundletool.jar dump manifest --bundle=app/build/outputs/bundle/release/app-release.aab | grep -i "sdk" || true
