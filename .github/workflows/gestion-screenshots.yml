name: Gestion screenshots

# Captures d'écran de l'app Gestion (jeu d'exemple), rendues sans émulateur
# par ScreenshotTest (Robolectric), puis versionnées dans
# android/gestion/screenshots/ pour être consultées sans installer l'app.
on:
  push:
    branches:
      - "**"
    paths:
      - "android/gestion/src/**"
      - "android/gestion/build.gradle.kts"
      - ".github/workflows/gestion-screenshots.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gestion-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Voir android-build.yml : seul platform-tools est nécessaire.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run screenshot tests
        run: ./gradlew :gestion:testDebugUnitTest --tests "fr.gemsofrod.gestion.ScreenshotTest" --no-daemon

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gestion-screenshots
          path: android/gestion/build/outputs/screenshots/*.png
          if-no-files-found: error

      - name: Commit screenshots
        run: |
          mkdir -p gestion/screenshots
          cp gestion/build/outputs/screenshots/*.png gestion/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gestion/screenshots
          if git diff --cached --quiet; then
            echo "Captures inchangées."
            exit 0
          fi
          git commit -m "Gestion : captures d'écran"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - name: Print test failure details
        if: failure()
        run: cat gestion/build/test-results/testDebugUnitTest/*.xml || true
