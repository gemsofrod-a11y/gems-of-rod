name: Fetch gem images

on:
  push:
    paths:
      - "scripts/fetch_gem_images.py"
      - ".github/workflows/fetch-gem-images.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch royalty-free gem photos from Wikimedia Commons
        run: python3 scripts/fetch_gem_images.py

      - name: Commit and push generated images and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/src/androidMain/res/drawable-nodpi \
                  android/app/src/commonMain/kotlin/fr/gemsofrod/encyclopedie/data/GemImages.kt \
                  android/gem_image_credits.json \
                  android/IMAGE_FETCH_REPORT.md
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "chore: photos des gemmes (Wikimedia Commons, licences libres)"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejeté (branche mise à jour entre-temps), rebase et nouvel essai..."
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
          fi
