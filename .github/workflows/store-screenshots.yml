name: Store screenshots

# Captures « vitrine » pour la fiche Play Store (StoreScreenshotTest) : écrans
# réels de l'app compilée dans un cadre aux couleurs de la maison, 1440 × 2560 px.
# Poussées sur la branche « store-screenshots » pour relecture et téléchargement.
on:
  workflow_dispatch: {}
  push:
    branches-ignore:
      - store-screenshots
    paths:
      - "android/app/src/test/java/fr/gemsofrod/encyclopedie/StoreScreenshotTest.kt"
      - ".github/workflows/store-screenshots.yml"
  pull_request:
    paths:
      - "android/app/src/test/java/fr/gemsofrod/encyclopedie/StoreScreenshotTest.kt"
      - ".github/workflows/store-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: store-screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run facet screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "fr.gemsofrod.encyclopedie.StoreScreenshotTest" --no-daemon

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: android/app/build/outputs/store-screenshots/*.png
          if-no-files-found: error

      # Les captures sont aussi poussées (écrasées à chaque fois) sur la branche
      # « store-screenshots », pour les relire sans télécharger l'artifact.
      - name: Publish screenshots to branch store-screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          out="$RUNNER_TEMP/facet-shots"
          rm -rf "$out" && mkdir -p "$out" && cp app/build/outputs/store-screenshots/*.png "$out/"
          cd "$out"
          git init -q && git checkout -q -b store-screenshots
          git add . && git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Captures Play Store ($SRC_SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:store-screenshots

      - name: Print test failure stack traces on failure
        if: failure()
        run: cat app/build/test-results/testDebugUnitTest/*.xml || true
