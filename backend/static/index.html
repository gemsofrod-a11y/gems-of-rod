<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151310">
<title>Gems of Rod — Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gems of Rod">
<style>
  :root {
    --bg: #151310;
    --card: #201c17;
    --gold: #c9a227;
    --gold-dim: #8a7220;
    --text: #f1ece0;
    --text-dim: #a89f8d;
    --danger: #b5453a;
    --ok: #4a7a52;
    --nav-h: 56px;
    --mic-h: 66px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(201,162,39,.11), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(110,220,255,.09), transparent 46%);
    background-size: 180% 180%, 180% 180%;
    background-repeat: no-repeat;
    animation: bg-drift 28s ease-in-out infinite alternate;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  @keyframes bg-drift {
    0%   { background-position: 10% 10%, 90% 90%; }
    100% { background-position: 55% 35%, 45% 65%; }
  }
  header {
    padding: 16px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute; left: 16px; right: 16px; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,39,.55), rgba(110,220,255,.55), transparent);
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .02em;
    margin: 0;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #7fdcff;
    box-shadow: 0 0 6px 2px rgba(110,220,255,.7);
    animation: think-pulse 2.4s ease-in-out infinite;
  }
  header button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    padding: 4px 8px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 8px 16px calc(var(--nav-h) + var(--mic-h) + var(--safe-b) + 16px);
    scroll-padding-bottom: calc(var(--nav-h) + var(--mic-h) + var(--safe-b) + 16px);
  }
  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + var(--safe-b));
    display: flex;
    background: #100e0b;
    border-top: 1px solid #2a251d;
    padding-bottom: var(--safe-b);
  }
  nav button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
  }
  .nav-indicator {
    position: absolute;
    top: 0; left: 0;
    width: 33.333%;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), #7fdcff);
    box-shadow: 0 0 8px 1px rgba(110,220,255,.6);
    transition: transform .3s ease;
  }
  nav button.active { color: var(--gold); }
  .tab { display: none; }
  .tab.active { display: block; }

  .bubble {
    max-width: 85%;
    margin: 6px 0;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
  }
  .bubble.user { margin-left: auto; background: var(--gold-dim); color: #fff; }
  .bubble.assistant {
    background: linear-gradient(160deg, #221d17, #17130f);
    color: var(--text);
    border: 1px solid rgba(110,220,255,.12);
    border-left: 2px solid rgba(110,220,255,.6);
  }
  .bubble.listening { opacity: 0.6; font-style: italic; }
  .actions-note {
    font-size: 12px;
    color: var(--ok);
    margin: -4px 0 10px 4px;
  }

  .thinking {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--card);
    border-left: 2px solid rgba(110,220,255,.55);
    border-radius: 14px;
    padding: 12px 16px;
    margin: 6px 0;
  }
  .thinking .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7fdcff;
    box-shadow: 0 0 6px 1px rgba(110,220,255,.7);
    animation: think-pulse 1.1s ease-in-out infinite;
  }
  .thinking .dot:nth-child(2) { animation-delay: .18s; }
  .thinking .dot:nth-child(3) { animation-delay: .36s; }
  @keyframes think-pulse {
    0%, 100% { opacity: .3; transform: scale(.8); }
    50%      { opacity: 1; transform: scale(1.15); }
  }

  .boot-line {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: .04em;
    margin: 4px 0 14px;
    opacity: 0;
    animation: boot-fade 1.2s ease forwards;
  }
  .boot-line .led {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7fdcff;
    box-shadow: 0 0 6px 2px rgba(110,220,255,.7);
    margin-right: 6px;
  }
  @keyframes boot-fade {
    0% { opacity: 0; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .mic-row {
    position: fixed;
    bottom: calc(var(--nav-h) + var(--safe-b)); left: 0; right: 0;
    height: var(--mic-h);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: linear-gradient(to top, var(--bg) 75%, transparent);
  }
  .mic-row input[type=text] {
    flex: 1;
    background: var(--card);
    border: 1px solid #332c20;
    color: var(--text);
    padding: 12px 14px;
    border-radius: 20px;
    font-size: 15px;
  }
  #micBtn, #sendBtn {
    position: relative;
    border: none;
    border-radius: 50%;
    width: 46px; height: 46px;
    font-size: 20px;
    background: var(--gold);
    color: #1a1610;
    flex-shrink: 0;
  }
  #micBtn.listening { background: var(--danger); color: #fff; }
  #micBtn.listening::before,
  #micBtn.listening::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(181,69,58,.65);
    animation: mic-pulse 1.6s ease-out infinite;
  }
  #micBtn.listening::after { animation-delay: .8s; }
  @keyframes mic-pulse {
    0%   { transform: scale(1); opacity: .8; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  #sendBtn { border-radius: 20px; width: auto; padding: 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid #2a251d;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    animation: card-rise .4s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes card-rise {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .card .subject { font-weight: 600; margin-bottom: 4px; }
  .card .reasoning { font-size: 13px; color: var(--text-dim); margin: 8px 0; font-style: italic; }
  .card textarea {
    width: 100%;
    min-height: 90px;
    background: #16130f;
    color: var(--text);
    border: 1px solid #332c20;
    border-radius: 8px;
    padding: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .card .actions { display: flex; gap: 8px; }
  .card .actions button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-approve { background: var(--ok); color: #fff; }
  .btn-reject { background: #3a352a; color: var(--text); }
  .empty { color: var(--text-dim); text-align: center; margin-top: 40px; font-size: 14px; }

  .orb-wrap { display: flex; justify-content: center; padding: 8px 0 10px; }
  .orb {
    position: relative;
    width: 78px; height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6d8, var(--gold) 42%, #7a5e10 76%, #241c0d 100%);
    box-shadow: 0 0 22px 6px rgba(201,162,39,.45), 0 0 56px 14px rgba(201,162,39,.15), inset 0 0 18px rgba(0,0,0,.4);
    animation: orb-breathe 4s ease-in-out infinite;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  .orb::before {
    content: '';
    position: absolute; inset: 15%;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
    animation: orb-spin 9s linear infinite;
  }
  .orb::after {
    content: '';
    position: absolute; inset: -7px;
    border-radius: 50%;
    border: 1px solid rgba(201,162,39,.3);
  }
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
  @keyframes orb-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .orb.listening {
    animation: orb-breathe 1.1s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, #eafcff, #7fdcff 42%, #12586e 76%, #0a2530 100%);
    box-shadow: 0 0 26px 8px rgba(110,220,255,.55), 0 0 70px 18px rgba(110,220,255,.22), inset 0 0 18px rgba(0,0,0,.4);
  }
  .orb.listening::after { border-color: rgba(110,220,255,.45); }
  .orb.thinking {
    animation: orb-breathe .55s ease-in-out infinite;
  }
  .orb.thinking::before { animation-duration: 1.2s; }
  .orb.speaking {
    animation: orb-speak .45s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, #fffaf0, var(--gold) 40%, #8a6d18 76%, #2a2010 100%);
    box-shadow: 0 0 30px 9px rgba(201,162,39,.55), 0 0 74px 20px rgba(110,220,255,.2), inset 0 0 18px rgba(0,0,0,.4);
  }
  @keyframes orb-speak {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  .digest-banner {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0 12px;
    margin-bottom: 6px;
    border-bottom: 1px solid #2a251d;
  }
  .digest-chip {
    flex-shrink: 0;
    background: var(--card);
    border-radius: 20px;
    padding: 7px 13px;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    border: none;
  }
  .digest-chip b { color: var(--gold); font-size: 13px; }
  .digest-chip.btn { background: var(--gold); color: #1a1610; font-weight: 600; }

  .notif {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    max-width: 92%;
    margin: 10px auto;
    padding: 10px 14px;
    border-radius: 12px;
    background: #1c1811;
    border: 1px dashed #3a331f;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
  }
  .email-chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    border: 1px solid #3d3320;
    border-left: 3px solid var(--gold);
    background: linear-gradient(135deg, #241f17, #191510);
    border-radius: 10px;
    padding: 9px 14px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    overflow: visible;
  }
  .email-chip .subject { overflow-wrap: anywhere; }
  .email-chip::after {
    content: '';
    position: absolute;
    left: -1px; right: -1px; top: 0; height: 45%;
    background: linear-gradient(to bottom, transparent, rgba(110,220,255,.65), transparent);
    opacity: 0;
    pointer-events: none;
  }
  .ring {
    position: absolute;
    left: 50%; top: 50%;
    width: 100%; height: 100%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(110,220,255,.85);
    border-radius: 10px;
    pointer-events: none;
    animation: jarvis-ring 900ms ease-out forwards;
  }
  @keyframes jarvis-ring {
    0%   { transform: translate(-50%, -50%) scale(.6); opacity: .9; }
    100% { transform: translate(-50%, -50%) scale(1.9); opacity: 0; }
  }
  @keyframes jarvis-scan {
    0%, 8%   { transform: translateY(-120%); opacity: 0; }
    18%      { opacity: 1; }
    88%      { opacity: 1; }
    100%     { transform: translateY(320%); opacity: 0; }
  }
  @keyframes evaporate-card {
    0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) brightness(1) saturate(1); border-color: #3d3320; }
    30%  { filter: blur(0) brightness(1.6) saturate(1.5); border-color: rgba(110,220,255,.7); }
    100% { opacity: 0; transform: translateY(-16px) scale(.9); filter: blur(9px) brightness(2.3) saturate(1.8); border-color: rgba(110,220,255,0); }
  }
  .email-chip.evaporate {
    animation: evaporate-card 950ms cubic-bezier(.4,0,.2,1) forwards;
    pointer-events: none;
    box-shadow: 0 0 24px rgba(110,220,255,.4), 0 2px 10px rgba(0,0,0,.35);
  }
  .email-chip.evaporate::after {
    opacity: 1;
    animation: jarvis-scan 900ms linear forwards;
  }
  .spark {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #7fdcff;
    box-shadow: 0 0 8px 2px #7fdcff;
    pointer-events: none;
    animation: spark-rise 800ms ease-out forwards;
  }
  @keyframes spark-rise {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), -38px) scale(.3); }
  }

  /* Archivage : geste doux et non destructif (contrairement à l'évaporation
     réservée à la suppression) — la fiche glisse et s'estompe, comme rangée. */
  @keyframes chip-archive {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(26px) scale(.85); opacity: 0; }
  }
  .email-chip.archiving {
    animation: chip-archive .7s ease-in forwards;
    pointer-events: none;
  }

  /* Fiche de réponse : le corps du mail rédigé par l'assistant s'écrit à
     l'écran (effet machine à écrire) pour que Sébastien puisse le relire
     sans quitter l'app, avant de décider de l'envoyer ou de le laisser en
     brouillon. */
  .reply-card {
    border: 1px solid #3d3320;
    border-left: 3px solid #7fdcff;
    background: linear-gradient(135deg, #1c1912, #14110d);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 10px 0;
    box-shadow: 0 2px 12px rgba(0,0,0,.35);
    animation: card-rise .4s cubic-bezier(.22,1,.36,1) backwards;
  }
  .reply-card .reply-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .reply-card .reply-subject { font-weight: 600; color: var(--text); }
  .reply-card .reply-body {
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    min-height: 1.2em;
  }
  .reply-card .caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #7fdcff;
    margin-left: 1px;
    vertical-align: text-bottom;
    box-shadow: 0 0 6px 1px rgba(110,220,255,.8);
    animation: caret-blink .8s step-end infinite;
  }
  @keyframes caret-blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }
  .reply-card .reply-status {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ok);
    opacity: 0;
    animation: boot-fade .4s ease forwards;
  }
  .reply-card .reply-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    opacity: 0;
    animation: boot-fade .4s ease forwards;
  }
  .reply-card .reply-actions button {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .reply-card .btn-send-now { background: var(--gold); color: #1a1610; }
  .reply-card .btn-keep-draft { background: #3a352a; color: var(--text); }

  /* Carrousel 3D : quand plusieurs emails sont traités d'un coup, elles se
     présentent une par une avec de la profondeur, puis se désintègrent,
     avant de laisser la place au fil de discussion normal. */
  .carousel-label {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: .02em;
    margin: 6px 0 2px;
  }
  .carousel-stage {
    position: relative;
    height: 48px;
    margin: 4px auto 16px;
    max-width: 92%;
    perspective: 700px;
  }
  .carousel-card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #3d3320;
    border-left: 3px solid var(--gold);
    background: linear-gradient(135deg, #241f17, #191510);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    opacity: 0;
    transform: rotateX(-16deg) translateY(-10px) scale(.9);
    transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .45s ease;
  }
  .carousel-card.active { opacity: 1; transform: rotateX(0) translateY(0) scale(1); }
  .carousel-card::after {
    content: '';
    position: absolute;
    left: -1px; right: -1px; top: 0; height: 45%;
    background: linear-gradient(to bottom, transparent, rgba(110,220,255,.65), transparent);
    opacity: 0;
    pointer-events: none;
  }
  .carousel-card.evaporate {
    animation: evaporate-card 950ms cubic-bezier(.4,0,.2,1) forwards;
    pointer-events: none;
    box-shadow: 0 0 24px rgba(110,220,255,.4), 0 6px 18px rgba(0,0,0,.4);
  }
  .carousel-card.evaporate::after {
    opacity: 1;
    animation: jarvis-scan 900ms linear forwards;
  }
  /* Sortie douce (pas une suppression) : utilisée quand le carrousel se
     contente d'annoncer des emails, sans les supprimer. */
  .carousel-card.exit {
    opacity: 0;
    transform: translateY(10px) scale(.95);
  }

  .primary-btn {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    color: #1a1610;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
  }

  #gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    gap: 12px;
    z-index: 50;
  }
  #gate h2 { color: var(--gold); margin: 0 0 4px; }
  #gate p { color: var(--text-dim); font-size: 14px; line-height: 1.5; }
  #gate input {
    background: var(--card);
    border: 1px solid #332c20;
    color: var(--text);
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
  }
  #gate .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="gate" class="hidden">
  <h2>Gems of Rod</h2>
  <p>Collez le jeton de l'assistant (<code>ASSISTANT_API_TOKEN</code>, celui défini
  dans les variables d'environnement du serveur) pour vous connecter depuis ce
  téléphone. Il reste enregistré uniquement sur cet appareil.</p>
  <input id="tokenInput" type="password" placeholder="Jeton d'accès" autocomplete="off">
  <button class="primary-btn" onclick="saveToken()">Se connecter</button>
  <div class="err" id="gateErr"></div>
</div>

<header>
  <h1>💎 Gems of Rod <span class="status-dot"></span></h1>
  <div>
    <button onclick="newConversation()" title="Nouvelle conversation">🗑️</button>
    <button onclick="resetToken()" title="Changer de jeton">⚙️</button>
  </div>
</header>

<main>
  <section id="tab-vocal" class="tab active">
    <div class="orb-wrap"><div class="orb" id="orb"></div></div>
    <div id="digestBanner" class="digest-banner"></div>
    <div id="log"></div>
  </section>

  <section id="tab-pending" class="tab">
    <div id="pendingList"></div>
  </section>

  <section id="tab-historique" class="tab">
    <div id="historyLog"></div>
  </section>
</main>

<div class="mic-row" id="micRow">
  <button id="micBtn" onclick="toggleMic()">🎤</button>
  <input id="textInput" type="text" placeholder="Écrire une commande..." onkeydown="if(event.key==='Enter') sendText()">
  <button id="sendBtn" onclick="sendText()">Envoyer</button>
</div>

<nav>
  <div class="nav-indicator" id="navIndicator"></div>
  <button id="navVocal" class="active" onclick="showTab('vocal')">🎙️ Vocal</button>
  <button id="navPending" onclick="showTab('pending')">📋 En attente</button>
  <button id="navHistorique" onclick="showTab('historique')">🕒 Historique</button>
</nav>

<script>
let TOKEN = localStorage.getItem('gor_token') || '';

function saveToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) { document.getElementById('gateErr').textContent = 'Jeton requis.'; return; }
  TOKEN = v;
  localStorage.setItem('gor_token', v);
  document.getElementById('gate').classList.add('hidden');
  warmUpSpeech();
  init();
}

function resetToken() {
  if (confirm('Se déconnecter de ce téléphone ?')) {
    localStorage.removeItem('gor_token');
    location.reload();
  }
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    localStorage.removeItem('gor_token');
    location.reload();
    throw new Error('unauthorized');
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// --- Navigation ---
const _tabNames = ['vocal', 'pending', 'historique'];
function showTab(name) {
  _tabNames.forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
    document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === name);
  });
  document.getElementById('micRow').style.display = name === 'vocal' ? 'flex' : 'none';
  document.getElementById('navIndicator').style.transform = `translateX(${_tabNames.indexOf(name) * 100}%)`;
  if (name === 'pending') loadPending();
  if (name === 'historique') loadHistoryTab();
}

// --- Cœur de l'assistant (orbe) : reflète son état en temps réel ---
function setOrb(state) {
  const orb = document.getElementById('orb');
  if (!orb) return;
  orb.className = 'orb' + (state ? ' ' + state : '');
}

// --- Vocal (fil en direct : conversation + notifications d'actions auto) ---
function addBubble(text, who, scroll = true) {
  const log = document.getElementById('log');
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.textContent = text;
  log.appendChild(b);
  if (scroll) b.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// L'écran principal ne charge plus tout l'historique : il ne montre que ce
// qui se passe à partir de maintenant (conversation + notifications en
// direct). L'historique complet reste consultable dans l'onglet dédié.
async function loadHistoryTab() {
  const container = document.getElementById('historyLog');
  container.innerHTML = '<p class="empty">Chargement...</p>';
  try {
    const items = await api('/api/voice/history');
    if (!items.length) { container.innerHTML = '<p class="empty">Pas encore d\'historique.</p>'; return; }
    container.innerHTML = '';
    items.forEach(m => {
      const b = document.createElement('div');
      b.className = 'bubble ' + m.role;
      b.textContent = m.text;
      container.appendChild(b);
    });
  } catch (e) {
    container.innerHTML = '<p class="empty">Erreur de chargement.</p>';
  }
}

async function newConversation() {
  if (!confirm('Effacer cette conversation et repartir de zéro ?')) return;
  await api('/api/voice/reset', { method: 'POST' });
  document.getElementById('log').innerHTML = '';
}

// Le tout premier appel à speechSynthesis.speak() sur la page met souvent
// 1 à 2 secondes à démarrer le moteur vocal du téléphone. On le "préchauffe"
// en silence dès le premier geste de l'utilisateur pour que la première
// vraie réponse soit lue instantanément.
let _speechWarmed = false;
function warmUpSpeech() {
  if (_speechWarmed || !('speechSynthesis' in window)) return;
  _speechWarmed = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) { /* tant pis, la voix se réveillera au premier vrai message */ }
}
document.addEventListener('pointerdown', warmUpSpeech, { once: true });

// Les voix "locales" embarquées dans Android sont saccadées/robotiques ;
// les voix "Google" (moteur réseau, meilleure qualité) sonnent bien plus
// naturelles quand elles sont disponibles sur l'appareil.
let _frenchVoice = null;
function pickFrenchVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  const fr = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  if (!fr.length) return null;
  return fr.find(v => /google/i.test(v.name)) || fr.find(v => !v.localService) || fr[0];
}
if ('speechSynthesis' in window) {
  _frenchVoice = pickFrenchVoice();
  speechSynthesis.onvoiceschanged = () => { _frenchVoice = pickFrenchVoice(); };
}

// Une seule très longue utterance sonne monocorde et s'emballe sur la fin.
// Découper phrase par phrase (le navigateur les enchaîne avec une micro-pause
// naturelle entre chacune) donne une lecture bien plus posée et humaine.
function speak(text) {
  if (!('speechSynthesis' in window) || !text) { setOrb('idle'); return; }
  speechSynthesis.cancel();
  const sentences = (text.match(/[^.!?]+[.!?]*/g) || [text]).map(s => s.trim()).filter(Boolean);
  if (!sentences.length) { setOrb('idle'); return; }
  let remaining = sentences.length;
  sentences.forEach((sentence, idx) => {
    const u = new SpeechSynthesisUtterance(sentence);
    u.lang = 'fr-FR';
    if (_frenchVoice) u.voice = _frenchVoice;
    u.rate = 0.97;
    u.pitch = 1;
    if (idx === 0) u.onstart = () => setOrb('speaking');
    u.onend = () => { remaining--; if (remaining <= 0) setOrb('idle'); };
    u.onerror = () => { remaining--; if (remaining <= 0) setOrb('idle'); };
    speechSynthesis.speak(u);
  });
}

function actionLabel(action) {
  const idx = action.indexOf(':');
  return idx === -1 ? action : action.slice(idx + 1).trim();
}

// Effet "évaporation" : le titre de l'email s'illumine puis se dissout en
// particules de lumière qui s'élèvent, pour confirmer visuellement une
// suppression.
function evaporateChip(chip, delay = 700) {
  setTimeout(() => {
    const ring = document.createElement('span');
    ring.className = 'ring';
    chip.appendChild(ring);
    const w = chip.offsetWidth, h = chip.offsetHeight;
    for (let i = 0; i < 12; i++) {
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.style.left = (Math.random() * w) + 'px';
      spark.style.top = (Math.random() * h) + 'px';
      spark.style.setProperty('--dx', (Math.random() * 50 - 25) + 'px');
      spark.style.animationDelay = (Math.random() * 200) + 'ms';
      chip.appendChild(spark);
    }
    chip.classList.add('evaporate');
    setTimeout(() => chip.remove(), 1000);
  }, delay);
}

// Effet "archivage" : geste doux (glisse + s'estompe), pour bien le
// distinguer visuellement de la désintégration réservée à la suppression.
function archiveChip(chip, delay = 700) {
  setTimeout(() => {
    chip.classList.add('archiving');
    setTimeout(() => chip.remove(), 700);
  }, delay);
}

function makeEmailChip(subject) {
  const chip = document.createElement('div');
  chip.className = 'email-chip';
  chip.innerHTML = '📧 <span class="subject"></span>';
  chip.querySelector('.subject').textContent = subject;
  return chip;
}

// Les suppressions/archivages demandés en conversation ("supprime cet
// email", "archive celui-ci") ont un format reconnaissable (trash_email: ...
// « Titre », archive_email: ... « Titre ») : on les affiche comme une fiche
// email qui s'évapore (suppression) ou glisse hors champ en douceur
// (archivage), plutôt qu'une ligne de texte. Les réponses (send_reply /
// create_draft) sont déjà présentées à part par renderReplyCard (voir
// data.drafts), donc ignorées ici pour ne pas les afficher en double.
function handleActionResults(actions) {
  if (!actions || !actions.length) return;
  const log = document.getElementById('log');
  const plain = [];
  actions.forEach(a => {
    const trashed = a.match(/^trash_email:.*«\s*(.+?)\s*»/);
    const archived = a.match(/^archive_email:.*«\s*(.+?)\s*»/);
    if (trashed) {
      const chip = makeEmailChip(trashed[1]);
      log.appendChild(chip);
      chip.scrollIntoView({ behavior: 'smooth', block: 'end' });
      evaporateChip(chip);
    } else if (archived) {
      const chip = makeEmailChip(archived[1]);
      log.appendChild(chip);
      chip.scrollIntoView({ behavior: 'smooth', block: 'end' });
      archiveChip(chip);
    } else if (a.startsWith('send_reply:') || a.startsWith('create_draft:')) {
      // déjà affiché par renderReplyCard.
    } else {
      plain.push(actionLabel(a));
    }
  });
  if (plain.length) {
    const note = document.createElement('div');
    note.className = 'actions-note';
    note.textContent = '✓ ' + plain.join(' · ');
    log.appendChild(note);
    note.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

function showThinking() {
  const log = document.getElementById('log');
  const el = document.createElement('div');
  el.className = 'thinking';
  el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  log.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  setOrb('thinking');
  return el;
}

async function sendMessage(text, { skipUserBubble = false } = {}) {
  if (!skipUserBubble) addBubble(text, 'user');
  const thinking = showThinking();
  try {
    const data = await api('/api/voice', { method: 'POST', body: JSON.stringify({ text }) });
    thinking.remove();
    addBubble(data.reply, 'assistant');
    if (data.emails && data.emails.length) renderAnnounceCarousel(dedupeEmails(data.emails));
    handleActionResults(data.actions);
    if (data.drafts && data.drafts.length) data.drafts.forEach(renderReplyCard);
    speak(data.reply);
  } catch (e) {
    thinking.remove();
    setOrb('idle');
    addBubble('Erreur : ' + e.message, 'assistant');
  }
}

async function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await sendMessage(text);
}

let recognition = null;
let listening = false;
let liveBubble = null;

function toggleMic() {
  warmUpSpeech();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("La reconnaissance vocale n'est pas disponible dans ce navigateur. Utilisez le champ texte."); return; }
  if (listening) { recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    document.getElementById('micBtn').classList.add('listening');
    setOrb('listening');
    liveBubble = document.createElement('div');
    liveBubble.className = 'bubble user listening';
    liveBubble.textContent = '…';
    document.getElementById('log').appendChild(liveBubble);
    liveBubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
  };
  recognition.onend = () => {
    listening = false;
    document.getElementById('micBtn').classList.remove('listening');
    // Si liveBubble est déjà null, la phrase a été envoyée : sendMessage
    // pilote déjà l'orbe (réflexion), ne pas l'écraser en le remettant à idle.
    if (liveBubble) { liveBubble.remove(); liveBubble = null; setOrb('idle'); }
  };
  recognition.onerror = () => {
    listening = false;
    document.getElementById('micBtn').classList.remove('listening');
    if (liveBubble) { liveBubble.remove(); liveBubble = null; setOrb('idle'); }
  };
  recognition.onresult = (event) => {
    let transcript = '';
    let isFinal = false;
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
      if (event.results[i].isFinal) isFinal = true;
    }
    if (!liveBubble) return;
    liveBubble.textContent = transcript || '…';
    liveBubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
    if (isFinal && transcript.trim()) {
      liveBubble.dataset.sent = '1';
      liveBubble.classList.remove('listening');
      const finalText = transcript.trim();
      const sentBubble = liveBubble;
      liveBubble = null;
      sentBubble.textContent = finalText;
      sendMessage(finalText, { skipUserBubble: true });
    }
  };
  recognition.start();
}

// --- Pending ---
async function loadPending() {
  const list = document.getElementById('pendingList');
  list.innerHTML = '<p class="empty">Chargement...</p>';
  try {
    const items = await api('/api/pending');
    if (!items.length) { list.innerHTML = '<p class="empty">Aucun email en attente 🎉</p>'; return; }
    list.innerHTML = '';
    items.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 70) + 'ms';
      card.innerHTML = `
        <div class="meta">${escapeHtml(p.from_addr || '')} · ${escapeHtml(p.category || '')}</div>
        <div class="subject">${escapeHtml(p.subject || '(sans objet)')}</div>
        <div class="reasoning">${escapeHtml(p.reasoning || '')}</div>
        <textarea id="reply-${p.id}">${escapeHtml(p.suggested_reply || '')}</textarea>
        <div class="actions">
          <button class="btn-approve" onclick="resolvePending('${p.id}', 'approve')">Envoyer</button>
          <button class="btn-reject" onclick="resolvePending('${p.id}', 'reject')">Ignorer</button>
        </div>
      `;
      list.appendChild(card);
    });
  } catch (e) {
    list.innerHTML = '<p class="empty">Erreur de chargement.</p>';
  }
}

async function resolvePending(id, decision) {
  const body = decision === 'approve'
    ? { edited_reply: document.getElementById('reply-' + id).value }
    : {};
  await api(`/api/pending/${id}/${decision}`, { method: 'POST', body: JSON.stringify(body) });
  loadPending();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Bannière résumé (compacte, en haut de l'écran Vocal) ---
async function loadDigestBanner() {
  const box = document.getElementById('digestBanner');
  try {
    const data = await api('/api/digest/today');
    const actions = data.actions || {};
    const labels = {
      auto_delete: '🗑️ Supprimées',
      auto_triage: '📂 Classées',
      auto_reply: '💬 Répondues',
    };
    let html = `<div class="digest-chip"><b>${data.pending}</b> en attente</div>`;
    for (const [key, label] of Object.entries(labels)) {
      html += `<div class="digest-chip">${label} <b>${actions[key] || 0}</b></div>`;
    }
    html += `<button class="digest-chip btn" onclick="runTriageNow()">🔄 Tri maintenant</button>`;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '';
  }
}

async function runTriageNow() {
  try {
    await api('/api/triage/run', { method: 'POST' });
    loadDigestBanner();
  } catch (e) { /* la bannière ne se mettra simplement pas à jour */ }
}

// --- Notifications en direct (actions automatiques) ---
const _actionLabels = {
  auto_delete: { icon: '🗑️', text: 'Newsletter supprimée automatiquement' },
  auto_triage: { icon: '📂', text: 'Email classé automatiquement' },
  auto_reply: { icon: '💬', text: 'Réponse envoyée automatiquement' },
};

function renderActionNotification(a) {
  const info = _actionLabels[a.action_type];
  if (!info) return; // actions techniques (auto_unsubscribe, auto_ignore...) : pas de bruit inutile
  const log = document.getElementById('log');
  const notif = document.createElement('div');
  notif.className = 'notif';
  notif.textContent = `${info.icon} ${info.text}`;
  let chip = null;
  if (a.detail) {
    chip = makeEmailChip(a.detail);
    notif.appendChild(chip);
  }
  log.appendChild(notif);
  notif.scrollIntoView({ behavior: 'smooth', block: 'end' });
  if (a.action_type === 'auto_delete' && chip) evaporateChip(chip, 1200);
}

// Quand plusieurs emails sont supprimés d'un coup (un cycle de tri qui en
// nettoie plusieurs), on les présente comme un petit carrousel en 3D qui les
// montre une par une avant de se désintégrer, plutôt qu'une pile de lignes
// de texte — puis le fil de discussion reprend normalement en dessous.
function renderDeleteCarousel(items) {
  const log = document.getElementById('log');
  const label = document.createElement('div');
  label.className = 'carousel-label';
  label.textContent = `🗑️ ${items.length} newsletters supprimées automatiquement`;
  log.appendChild(label);
  const stage = document.createElement('div');
  stage.className = 'carousel-stage';
  log.appendChild(stage);
  stage.scrollIntoView({ behavior: 'smooth', block: 'end' });

  let i = 0;
  function showNext() {
    if (i >= items.length) { setTimeout(() => stage.remove(), 200); return; }
    const card = document.createElement('div');
    card.className = 'carousel-card';
    card.textContent = '📧 ' + items[i].detail;
    stage.appendChild(card);
    requestAnimationFrame(() => card.classList.add('active'));
    i++;
    setTimeout(() => evaporateChip(card, 0), 1200);
    setTimeout(showNext, 2100);
  }
  showNext();
}

function dedupeEmails(emails) {
  const seen = new Set();
  const out = [];
  for (const e of emails) {
    if (!e || seen.has(e.message_id)) continue;
    seen.add(e.message_id);
    out.push(e);
    if (out.length >= 6) break;
  }
  return out;
}

// Quand l'assistant consulte/annonce des emails (recherche, lecture), on les
// présente brièvement dans le même carrousel — sans les supprimer, elles
// glissent juste hors champ une fois montrées — puis on revient entièrement
// au fil de discussion normal. La suppression, elle, redéclenche le
// carrousel séparément (renderDeleteCarousel / handleActionResults) au
// moment où l'action est confirmée.
function renderAnnounceCarousel(emails) {
  if (!emails.length) return;
  const log = document.getElementById('log');
  const label = document.createElement('div');
  label.className = 'carousel-label';
  label.textContent = `📬 ${emails.length} email${emails.length > 1 ? 's' : ''}`;
  log.appendChild(label);
  const stage = document.createElement('div');
  stage.className = 'carousel-stage';
  log.appendChild(stage);
  stage.scrollIntoView({ behavior: 'smooth', block: 'end' });

  let i = 0;
  function showNext() {
    if (i >= emails.length) {
      setTimeout(() => { label.remove(); stage.remove(); }, 250);
      return;
    }
    const card = document.createElement('div');
    card.className = 'carousel-card';
    card.textContent = '📧 ' + emails[i].subject;
    stage.appendChild(card);
    requestAnimationFrame(() => card.classList.add('active'));
    i++;
    setTimeout(() => {
      card.classList.remove('active');
      card.classList.add('exit');
      setTimeout(() => card.remove(), 400);
    }, 1300);
    setTimeout(showNext, 1700);
  }
  showNext();
}

// Quand l'assistant rédige une réponse (brouillon ou envoi direct sur
// instruction explicite), on la montre "s'écrire" à l'écran plutôt que de
// simplement annoncer l'action par une ligne de texte : Sébastien peut ainsi
// relire le contenu exact sans ouvrir Gmail. Un envoi direct se termine par
// une simple confirmation ; un brouillon propose de l'envoyer maintenant ou
// de le laisser tel quel — dans tous les cas, il existe déjà comme brouillon
// réel dans Gmail avant d'être éventuellement envoyé (voir gmail_client.send_reply).
function renderReplyCard(draft) {
  const log = document.getElementById('log');
  const card = document.createElement('div');
  card.className = 'reply-card';
  card.innerHTML = `
    <div class="reply-head">✍️ Réponse à <span class="reply-subject"></span></div>
    <div class="reply-body"><span class="caret"></span></div>
  `;
  card.querySelector('.reply-subject').textContent = draft.subject || '(sans objet)';
  log.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'end' });

  const bodyEl = card.querySelector('.reply-body');
  const caret = card.querySelector('.caret');
  const text = draft.body_text || '';
  // Rythme d'écriture adaptatif : rapide pour ne pas lasser sur un texte
  // long, mais assez lent pour rester lisible sur une réponse courte.
  const stepMs = text.length > 220 ? 6 : text.length > 90 ? 12 : 20;
  let i = 0;
  function typeNext() {
    if (i >= text.length) {
      caret.remove();
      finishReplyCard(card, draft);
      return;
    }
    i++;
    bodyEl.textContent = text.slice(0, i);
    bodyEl.appendChild(caret);
    if (i % 4 === 0) card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    setTimeout(typeNext, stepMs);
  }
  typeNext();
}

function finishReplyCard(card, draft) {
  if (draft.sent) {
    const status = document.createElement('div');
    status.className = 'reply-status';
    status.textContent = '✓ Envoyé';
    card.appendChild(status);
    return;
  }
  const actionsRow = document.createElement('div');
  actionsRow.className = 'reply-actions';
  actionsRow.innerHTML = `
    <button class="btn-send-now">Envoyer maintenant</button>
    <button class="btn-keep-draft">Laisser en brouillon</button>
  `;
  card.appendChild(actionsRow);
  actionsRow.querySelector('.btn-send-now').onclick = async (ev) => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Envoi...';
    try {
      await api(`/api/drafts/${draft.draft_id}/send`, { method: 'POST', body: JSON.stringify({}) });
      actionsRow.remove();
      const status = document.createElement('div');
      status.className = 'reply-status';
      status.textContent = '✓ Envoyé';
      card.appendChild(status);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Réessayer';
    }
  };
  actionsRow.querySelector('.btn-keep-draft').onclick = () => {
    actionsRow.remove();
    const status = document.createElement('div');
    status.className = 'reply-status';
    status.textContent = '📝 Enregistré en brouillon';
    card.appendChild(status);
  };
}

// Ne remonte que les actions survenues depuis l'ouverture de la page (pas tout
// l'historique passé, qui reste dans l'onglet Historique).
let _lastActionTs = new Date().toISOString();
async function pollActions() {
  try {
    const items = await api('/api/actions/recent?since=' + encodeURIComponent(_lastActionTs));
    if (!items.length) return;
    _lastActionTs = items[items.length - 1].created_at;
    const deletes = items.filter(a => a.action_type === 'auto_delete' && a.detail);
    const others = items.filter(a => !(a.action_type === 'auto_delete' && a.detail));
    if (deletes.length >= 2) {
      renderDeleteCarousel(deletes);
      others.forEach(renderActionNotification);
    } else {
      items.forEach(renderActionNotification);
    }
  } catch (e) { /* on retentera au prochain cycle */ }
}

function showBootLine() {
  const log = document.getElementById('log');
  const el = document.createElement('div');
  el.className = 'boot-line';
  el.innerHTML = '<span class="led"></span>Systèmes en ligne.';
  log.appendChild(el);
}

// --- Init ---
function init() {
  if (!TOKEN) {
    document.getElementById('gate').classList.remove('hidden');
    return;
  }
  document.getElementById('gate').classList.add('hidden');
  showBootLine();
  loadDigestBanner();
  pollActions();
  setInterval(pollActions, 25000);
  setInterval(loadDigestBanner, 60000);
}

init();
