<!doctype html><!--pwa-->
<html lang="fr"><!--pwa-->
<head><!--pwa-->
<meta charset="utf-8"><!--pwa-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--pwa-->
<meta name="theme-color" content="#0d3a2c"><!--pwa-->
<link rel="manifest" href="manifest.webmanifest"><!--pwa-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--pwa-->
<link rel="apple-touch-icon" href="icon.svg"><!--pwa-->
<title>Budget Clair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne de téléphone (max 600 px) entre une barre de titre collante et un dock
   d'onglets en bas. L'accueil raconte le mois : un bloc « Reste à vivre » vert profond, puis des
   cartes courtes qui renvoient chacune vers l'onglet détaillé. */
:root {
  --bg: #edf1ee;
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --ink: #14211c;
  --ink-2: #354740;
  --muted: #64746d;
  --line: #d9e2dd;
  --accent: #0b6b4d;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe6;
  --hero: #0d3a2c;
  --hero-ink: #eef7f2;
  --hero-muted: #a9c9bb;
  --ess: #2f6db3;
  --uti: #c1870f;
  --sup: #c2405c;
  --good: #1b8756;
  --warn: #b0741a;
  --crit: #c0392b;
  --good-bg: #e2f3ea;
  --warn-bg: #fbf0dc;
  --crit-bg: #fbe5e2;
  --info-bg: #e6eef8;
  --info: #2f5f9b;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b120f; --surface: #141d19; --surface-2: #19241f; --ink: #e5ede9; --ink-2: #c4d2cb; --muted: #8c9d95; --line: #25332d;
    --accent: #45c493; --accent-ink: #062a1c; --accent-soft: #163428; --hero: #10392b; --hero-ink: #eef7f2; --hero-muted: #9fc3b3;
    --ess: #71a4e6; --uti: #e2b04b; --sup: #e87892; --good: #4cc48a; --warn: #e2a64a; --crit: #f06c60;
    --good-bg: #13301f; --warn-bg: #33270f; --crit-bg: #3a1a17; --info-bg: #172638; --info: #8db5ea;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b120f; --surface: #141d19; --surface-2: #19241f; --ink: #e5ede9; --ink-2: #c4d2cb; --muted: #8c9d95; --line: #25332d;
  --accent: #45c493; --accent-ink: #062a1c; --accent-soft: #163428; --hero: #10392b; --hero-ink: #eef7f2; --hero-muted: #9fc3b3;
  --ess: #71a4e6; --uti: #e2b04b; --sup: #e87892; --good: #4cc48a; --warn: #e2a64a; --crit: #f06c60;
  --good-bg: #13301f; --warn-bg: #33270f; --crit-bg: #3a1a17; --info-bg: #172638; --info: #8db5ea;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .v, .amt { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Cadre */
.app { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 21px; font-weight: 700; white-space: nowrap; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--hero); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 18px; }
.bar-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.bar-actions .btn { white-space: nowrap; }
@media (max-width: 400px) { .lock span { display: none; } }
.lock { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.lock svg { width: 13px; height: 13px; }
#view { display: flex; flex-direction: column; gap: 14px; }

/* Boutons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--crit); }
.link { white-space: nowrap; flex: none; appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card-head > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plain { padding-inline: 2px; display: flex; flex-direction: column; gap: 4px; }

/* Bandeau d'état et exemple */
.banner { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; background: var(--info-bg); color: var(--ink); display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-bg); }
.banner.crit { background: var(--crit-bg); }
.banner .x { margin-left: auto; flex: none; appearance: none; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
.banner > div { min-width: 0; overflow-wrap: anywhere; }
.notices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.notices:empty { display: none; }

/* Accueil : bloc du mois */
.months { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.months::-webkit-scrollbar { display: none; }
.chip-btn { appearance: none; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.hero .eyebrow { color: var(--hero-muted); }
.hero-big { font-family: var(--display); font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
.hero-sub { color: var(--hero-muted); font-size: 13.5px; }
.hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hero-split > div { background: color-mix(in srgb, var(--hero-ink) 8%, transparent); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hero-split .v { font-family: var(--display); font-size: 22px; font-weight: 700; }
.hero-split .l { font-size: 12.5px; color: var(--hero-muted); }
.meter { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--hero-ink) 16%, transparent); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 99px; background: var(--hero-ink); }
.meter.over > span { background: #ff8a7a; }
.parts { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--hero-muted); }
.parts div { display: flex; justify-content: space-between; gap: 10px; }
.parts b { color: var(--hero-ink); font-weight: 600; }
.tag { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; margin-left: 6px; background: color-mix(in srgb, var(--hero-ink) 14%, transparent); color: var(--hero-ink); vertical-align: 1px; }

/* Listes */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-block: 11px; border-top: 1px solid var(--line); align-items: baseline; }
.li:first-child { border-top: 0; padding-top: 2px; }
.li .t { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.li .amt { font-weight: 700; text-align: right; white-space: nowrap; }
.li .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; }
.li.tap { cursor: pointer; }
.li .bar { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.li .bar > span { display: block; height: 100%; border-radius: 99px; }
.pos { color: var(--good); }
.neg { color: var(--crit); }
.chev { color: var(--muted); font-size: 12px; }
.sub-list { background: var(--surface-2); border-radius: 12px; padding: 4px 12px; margin-block: 4px 8px; grid-column: 1 / -1; }

/* Pastilles */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.crit { background: var(--crit-bg); color: var(--crit); }
.chip.info { background: var(--info-bg); color: var(--info); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.split span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Alertes et conseils */
.alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14px; }
.ic { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.ic.crit { background: var(--crit-bg); color: var(--crit); }
.ic.warn { background: var(--warn-bg); color: var(--warn); }
.ic.good { background: var(--good-bg); color: var(--good); }
.ic.info { background: var(--info-bg); color: var(--info); }
.advice { border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.advice:first-child { border-top: 0; padding-top: 0; }
.advice .head { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.advice p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.advice details summary { font-size: 13px; color: var(--accent); font-weight: 600; cursor: pointer; margin-top: 4px; list-style: none; }
.advice details summary::-webkit-details-marker { display: none; }
.advice > div { min-width: 0; }
.total { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--good); white-space: nowrap; }

/* Segments */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { appearance: none; border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent); }
.seg.small button { padding: 5px 6px; font-size: 12.5px; }
.lvl { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.lvl button { appearance: none; border: 0; background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 600; padding: 5px 9px; cursor: pointer; }
.lvl button + button { border-left: 1px solid var(--line); }
.lvl button[aria-pressed="true"][data-l="ess"] { background: var(--ess); color: #fff; }
.lvl button[aria-pressed="true"][data-l="uti"] { background: var(--uti); color: #fff; }
.lvl button[aria-pressed="true"][data-l="sup"] { background: var(--sup); color: #fff; }

/* Formulaires */
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.field input, .field select, .input, select.input { width: 100%; min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 15px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar .input { flex: 1 1 160px; width: auto; }
.pf { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pf-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.pf-top .t { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.pf details summary { font-size: 13px; color: var(--accent); font-weight: 600; cursor: pointer; }
.pf details[open] summary { margin-bottom: 10px; }

/* Budgets */
.track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.track > span { display: block; height: 100%; border-radius: 99px; }
.bud { display: flex; flex-direction: column; gap: 6px; padding-block: 10px; border-top: 1px solid var(--line); }
.bud:first-child { border-top: 0; padding-top: 0; }
.bud-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.bud-bot { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.bud-in { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.bud-in input { width: 84px; min-height: 34px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

/* Graphique */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.tip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
details > summary { cursor: pointer; }
summary.card-head { list-style: none; }
summary.card-head::-webkit-details-marker { display: none; }
details.card[open] .chev { transform: rotate(180deg); }

/* Accueil vide */
.welcome { display: flex; flex-direction: column; gap: 16px; padding-block: 8px; }
.welcome .hero-big { font-size: 34px; }
.steps { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14px; color: var(--hero-muted); }
.steps b { color: var(--hero-ink); }
.steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--hero-ink) 14%, transparent); color: var(--hero-ink); font-weight: 700; font-size: 13px; }
.hero .btn { border-color: transparent; }
.hero .btn.light { background: var(--hero-ink); color: var(--hero); }
.hero .btn.outline { background: transparent; color: var(--hero-ink); border-color: color-mix(in srgb, var(--hero-ink) 40%, transparent); }

/* Dock d'onglets */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { appearance: none; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 8px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; white-space: nowrap; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); }
.badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 99px; background: var(--crit); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

footer.note { font-size: 12px; color: var(--muted); padding-block: 8px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .hero, .card { animation: rise .25s ease-out both; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>
</head><!--pwa-->
<body><!--pwa-->
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#eef7f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg></span>
      <h1>Budget Clair</h1>
    </div>
    <div class="bar-actions">
      <span class="lock" title="Vos relevés restent sur ce téléphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>100 % local</span></span>
      <label class="btn soft small" for="file">+ Relevé</label>
    </div>
  </header>
  <input id="file" type="file" accept=".csv,.txt,.pdf,.xlsx,.xlsm,.json,application/json,text/csv,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" aria-label="Choisir un relevé">

  <div class="notices">
    <div id="status" class="banner" role="status" hidden></div>
    <details class="card" id="mapping" hidden>
      <summary><b>Colonnes du fichier</b> <span class="small muted">· corriger si besoin</span></summary>
      <div class="grid2" id="map-grid" style="margin-top:12px"></div>
      <div class="row" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="invert"> Les dépenses sont en positif dans mon fichier</label>
        <button class="btn primary small" id="apply-map" type="button">Appliquer</button>
      </div>
    </details>
  </div>

  <main id="view"></main>
</div>

<nav class="dock" aria-label="Sections">
  <div class="dock-in" role="tablist">
    <button class="tab" role="tab" data-tab="accueil" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Accueil</button>
    <button class="tab" role="tab" data-tab="mouvements" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M13 16l4 4 4-4"/></svg>Mouvements</button>

function decode(buf) {
  let bytes = new Uint8Array(buf);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes).replace(/^﻿/, ""); }
  catch (e) { return new TextDecoder("windows-1252").decode(bytes); }
}

function parseCSV(text, delim) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ""));
}

function detectDelimiter(text) {
  const sample = text.split(/\r?\n/).slice(0, 30).join("\n");
  let best = ";", bestScore = -1;
  for (const d of [";", ",", "\t", "|"]) {
    const rows = parseCSV(sample, d);
    const counts = rows.map(r => r.length).filter(n => n > 1);
    if (!counts.length) continue;
    const freq = {}; counts.forEach(n => freq[n] = (freq[n] || 0) + 1);
    const [mode, hits] = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
    const score = hits * Math.min(+mode, 12);
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}

function parseAmount(v) {
  if (v == null) return NaN;
  let s = String(v).replace(/[\s  ]/g, "").replace(/\u2212/g, "-").replace(/€|EUR|eur|\$|£/g, "");
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
  if (/^\+/.test(s)) s = s.slice(1);
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (lc > -1) s = s.replace(",", ".");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  const n = parseFloat(s);
  return neg ? -Math.abs(n) : n;
}

function parseDate(v) {
  const s = String(v || "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return mk(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return mk(y, +m[2], +m[1]); }
  const L = leadingDate(s);
  if (L && L.y) return mk(L.y, L.m, L.d);
  return null;
  function mk(y, mo, d) {
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
    return new Date(y, mo - 1, d, 12);
  }
}

    for (const k of ["date", "label", "amount", "debit", "credit"]) if (cells.some(c => HEAD_RULES[k].some(r => r.test(c)))) score++;
