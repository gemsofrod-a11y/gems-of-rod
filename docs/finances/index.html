function adviceTeaser(r) {
  const list = r.advice.filter(a => a.tone !== "good").slice(0, 3);
  if (!list.length) return "";
  const tot = r.advice.reduce((a, x) => a + x.saving, 0);
  return `<section class="card" aria-labelledby="h-at">
    <div class="card-head"><div><span class="eyebrow">Conseils</span><h2 id="h-at">${tot > 0 ? `${eur.format(tot)} d'économies possibles par an` : "À regarder"}</h2></div>${goto("conseils", "Tous")}</div>
    <div class="list">${list.map(a => `<div class="li tap" data-goto="conseils"><span class="t">${esc(a.title)}</span><span class="amt ${a.saving > 0 ? "pos" : ""}">${a.saving > 0 ? eur.format(a.saving) + " / an" : ""}</span></div>`).join("")}</div>
  </section>`;
}

// Prélèvements et abonnements attendus dans les 35 jours qui suivent la fin du relevé.
function upcomingCard(r) {
  const days = { mensuel: 30.44, hebdo: 7, trimestriel: 91.3, annuel: 365.25 };
  const soon = r.recurring.map(s => {
    let next = s.last; while (next <= r.to.getTime()) next += days[s.period] * 864e5;
    return { ...s, next };
  }).filter(s => s.next - r.to < 35 * 864e5).sort((a, b) => a.next - b.next);
  if (!soon.length) return "";
  const tot = soon.reduce((a, s) => a + s.amount, 0);
  return `<section class="card" aria-labelledby="h-up">
    <div class="card-head"><div><span class="eyebrow">Prochains prélèvements</span><h2 id="h-up">${eur.format(tot)} à prévoir</h2></div>${goto("budgets", "Abonnements")}</div>
    <div class="list">${soon.slice(0, 5).map(s => `<div class="li"><span class="t">${esc(niceName(s.key))}</span><span class="amt">${eur2.format(s.amount)}</span><span class="s">vers le ${dayFmt(new Date(s.next))} · ${s.period}</span></div>`).join("")}</div>
  </section>`;
}

function trendCard(r) {
  if (Object.keys(r.byMonth).length < 2) return "";
  const mo = r.months, now = r.now;
  return `<section class="card" aria-labelledby="h-tr">
    <div class="card-head"><div><span class="eyebrow">Mois par mois</span><h2 id="h-tr">Dépenses et revenus</h2></div></div>
    <div class="legend">${["ess", "uti", "sup"].map(l => `<span>${lvDot(l)}${LEVELS[l].label}</span>`).join("")}<span><span class="dot" style="background:var(--ink);border-radius:2px;height:3px;width:12px"></span>Revenus</span></div>
    <div class="chart" id="monthly"></div>
    <p class="small muted">Moyenne du ${r.from.toLocaleDateString("fr-FR")} au ${r.to.toLocaleDateString("fr-FR")} : ${eur.format(r.income / mo)} de revenus et ${eur.format(r.spend / mo)} de dépenses par mois.${now && now.changed ? ` Mois type aujourd'hui : ${eur.format(now.inc)} de revenus, ${eur.format(now.spend)} de dépenses.` : ""}${r.otherIn ? ` Autres entrées non comptées en revenus : ${eur.format(r.otherIn / mo)} par mois.` : ""}</p>
    <details><summary class="small muted">Voir en tableau</summary>
      <div class="table-wrap"><table><thead><tr><th>Mois</th><th>Revenus</th><th>Essentiel</th><th>Utile</th><th>Superflu</th><th>Épargne</th></tr></thead><tbody>
      ${Object.keys(r.byMonth).sort().reverse().map(k => { const m = r.byMonth[k]; return `<tr><td>${monthLabel(k)}</td><td>${eur.format(m.income)}</td><td>${eur.format(m.ess)}</td><td>${eur.format(m.uti)}</td><td>${eur.format(m.sup)}</td><td>${eur.format(m.savings)}</td></tr>`; }).join("")}
      </tbody></table></div>
    </details>
  </section>`;
}

function drawMonthly(r) {
  const box = $("#monthly"); if (!box) return;
  const keys = Object.keys(r.byMonth).sort().slice(-12);
  const W = Math.max(300, box.clientWidth), H = 200, padL = 40, padR = 6, padT = 10, padB = 24;
  const maxV = Math.max(1, ...keys.map(k => { const m = r.byMonth[k]; return Math.max(m.ess + m.uti + m.sup, m.income); }));
  const step = niceStep(maxV / 4), top = Math.ceil(maxV / step) * step;
  const y = v => padT + (H - padT - padB) * (1 - v / top);
  const slot = (W - padL - padR) / keys.length, bw = Math.min(30, slot * 0.58);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses par mois empilées par niveau, avec les revenus">`;
  for (let v = 0; v <= top + 1e-6; v += step) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("fr-FR") + " k" : v}</text>`;
  keys.forEach((k, i) => {
    const m = r.byMonth[k], cx = padL + slot * i + slot / 2, x = cx - bw / 2;
    let acc = 0;
    for (const l of ["ess", "uti", "sup"]) { if (!(m[l] > 0)) continue; const h = y(acc) - y(acc + m[l]); s += `<rect x="${x}" y="${y(acc + m[l])}" width="${bw}" height="${Math.max(0, h - 1)}" rx="2" fill="var(--${l})"/>`; acc += m[l]; }
    if (m.income > 0) s += `<line x1="${cx - bw / 2 - 4}" x2="${cx + bw / 2 + 4}" y1="${y(m.income)}" y2="${y(m.income)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
    if (slot >= 40 || (keys.length - 1 - i) % 2 === 0) s += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${MONTHS[+k.slice(5) - 1]}</text>`;
    s += `<rect x="${padL + slot * i}" y="${padT}" width="${slot}" height="${H - padT - padB}" fill="transparent" data-m="${k}" style="cursor:pointer"/>`;
  });
  s += `</svg><div class="tip" hidden></div>`;
  box.innerHTML = s;
  const tip = box.querySelector(".tip");
  const show = e => {
    const k = e.target.dataset && e.target.dataset.m; if (!k) { tip.hidden = true; return; }
    const m = r.byMonth[k], i = keys.indexOf(k), sx = box.clientWidth / W;
    tip.innerHTML = `<b>${monthLabel(k)}</b> · revenus ${eur.format(m.income)} · dépenses ${eur.format(m.ess + m.uti + m.sup)}`;
    tip.hidden = false;
    tip.style.left = Math.min(Math.max((padL + slot * i + slot / 2) * sx, 110), box.clientWidth - 110) + "px";
    tip.style.top = (y(Math.max(m.ess + m.uti + m.sup, m.income)) * sx - 6) + "px";
  };
  box.onpointermove = show; box.onpointerdown = show; box.onpointerleave = () => (tip.hidden = true);
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function savingsCard(r, only) {
  const s = r.sav, m = savingsMeta();
  const cell = (v, l) => `<div><span class="v">${v}</span><span class="l">${l}</span></div>`;
  return `<section class="hero" aria-labelledby="h-sav">
    <span class="eyebrow" id="h-sav">Compte d'épargne · du ${s.from.toLocaleDateString("fr-FR")} au ${s.to.toLocaleDateString("fr-FR")}</span>
    <p class="hero-big">${eur2.format(s.dep - s.wd + s.interest)}</p><p class="hero-sub">Variation de l'épargne sur la période</p>
    <div class="hero-split">${cell(eur2.format(s.dep), "Déposé")}${cell(eur2.format(s.wd), "Retiré")}${cell(eur2.format(s.interest), "Intérêts reçus")}${m && m.close != null ? cell(eur2.format(m.close), "Solde de clôture") : cell(m && m.rate ? fmtPct(m.rate) : "–", "Taux brut")}</div>
  </section>
  ${only ? `<div class="banner"><div>Ce relevé est celui d'un compte d'épargne : il ne contient pas de dépenses. Importez aussi le relevé de votre compte courant ; les deux s'additionnent sans compter deux fois les virements vers l'épargne.</div></div>` : ""}`;
}

// Sans revenu déclaré, l'accueil propose les entrées d'argent régulières : un appui en fait un revenu.
function incomeSetupCard(r) {
  const P = state.profile; if (!P || (P.incomes.length && !state.incSetupOpen) || r.onlySavings) return "";
  const groups = {};
  for (const t of r.txs || []) {
    const c = CAT[t.cat] || CAT.autre;
    if (t.amount <= 0 || t.acct === "epargne" || ["internal", "savings", "pro"].includes(c.kind) || t.cat === "interets") continue;
    const g = groups[t.key] || (groups[t.key] = { key: t.key, months: {}, total: 0, last: 0, lastAmt: 0 });
    const k = monthKey(new Date(t.date)); g.months[k] = (g.months[k] || 0) + t.amount; g.total += t.amount;
    if (t.date >= g.last) { g.last = t.date; g.lastAmt = t.amount; }
  }
  const list = Object.values(groups).filter(g => Object.keys(g.months).length >= 2).sort((a, b) => b.total - a.total).slice(0, 6);
  if (!list.length) return "";
  return `<section class="card" aria-labelledby="h-inc">
    <div class="card-head"><div><span class="eyebrow">À faire une fois</span><h2 id="h-inc">Quels sont vos revenus&nbsp;?</h2></div></div>
    <p class="small muted">Touchez uniquement vos vrais revenus, comme le salaire ou la CAF. Le reste à vivre les comptera en net, sans les virements de proches ni les remboursements.</p>
    <div class="list">${list.map(g => { const on = P.incomes.some(x => norm(x.match) === norm(g.key)); return `<div class="li"><span class="t">${esc(niceName(g.key))}</span>
      ${on ? `<button class="btn small soft" type="button" data-income-del="${esc(g.key)}" aria-pressed="true">✓ Revenu</button>` : `<button class="btn small" type="button" data-income-add="${esc(g.key)}">C'est un revenu</button>`}
      <span class="s">reçu ${Object.keys(g.months).length} mois · dernier versement ${eur2.format(g.lastAmt)} le ${new Date(g.last).toLocaleDateString("fr-FR")}</span></div>`; }).join("")}</div>
    ${P.incomes.length ? `<div class="row"><button class="btn primary" type="button" data-income-done>C'est tout</button><span class="small muted">Modifiable dans « Mon budget ».</span></div>` : ""}
  </section>`;
}

// Virements fréquents dont l'appli ne peut pas deviner la nature : une question, une fois.
function askCard() {
  const groups = {};
  for (const t of state.tx) {
    if (state.overrides[t.key] || !["entrees", "virements", "autre"].includes(t.cat) || t.acct === "epargne" || t.pf) continue;
    const sk = t.key + (t.amount > 0 ? "|+" : "|-");
    if (state.overrides[sk]) continue;
    const g = groups[sk] || (groups[sk] = { key: t.key, sk, n: 0, total: 0 });
    g.n++; g.total += t.amount;
  }
  const list = Object.values(groups).filter(g => g.n >= 3).sort((a, b) => Math.abs(b.total) - Math.abs(a.total)).slice(0, 3);
  if (!list.length) return "";
  const btn = (g, cat, txt) => `<button class="btn small" type="button" data-ask="${esc(g.sk)}" data-cat="${cat}">${txt}</button>`;
  return `<section class="card" aria-labelledby="h-ask">
    <div class="card-head"><div><span class="eyebrow">Une question</span><h2 id="h-ask">C'est quoi, ces virements&nbsp;?</h2></div></div>
    <p class="small muted">Ils reviennent souvent. Votre réponse vaut pour toutes les opérations de ce nom, et pour les prochains relevés.</p>
    <div class="list">${list.map(g => `<div class="li"><span class="t">${esc(niceName(g.key))}</span><span class="amt ${g.total > 0 ? "pos" : ""}">${g.total > 0 ? "+" : "−"}${eur.format(Math.abs(g.total))}</span>
      <span class="s">${g.n} fois</span>
      <div class="row" style="grid-column:1/-1">${g.total > 0
        ? btn(g, "interne", "Moi, d'un autre compte") + btn(g, "revenus", "Un revenu") + btn(g, "entrees", "Autre entrée")
        : btn(g, "interne", "Moi, vers un autre compte") + btn(g, "virements", "Un proche") + btn(g, "epargne", "Épargne")}</div></div>`).join("")}</div>
  </section>`;
}

/* ------------------------------ Mouvements ------------------------------ */
function periodControl() {
  if (!state.periodAvail) return "";
  const p = state.period || state.periodDefault;
  const opts = [["3", "3 derniers mois"], ["6", "6 derniers mois"], ["12", "12 derniers mois"], ["all", "Tout l'historique"]];
  return `<label class="field" for="period" style="max-width:220px">Période analysée<select id="period">${opts.map(([v, l]) => `<option value="${v}"${v === p ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;
}

function vMoves(r) {
  const mode = ["out", "in", "all"].includes(state.moves) ? state.moves : "out";
  const all = { in: 0, out: 0 }; for (const t of r.txs || []) all[t.amount > 0 ? "in" : "out"] += Math.abs(t.amount);
  const mo = r.months || 1;
  const seg = `<div class="seg" role="group" aria-label="Choisir la liste">
    <button type="button" data-moves="out" aria-pressed="${mode === "out"}">− Sorties</button>
    <button type="button" data-moves="in" aria-pressed="${mode === "in"}">+ Entrées</button>
    <button type="button" data-moves="all" aria-pressed="${mode === "all"}">Opérations</button></div>`;
  const head = `<div class="plain"><span class="eyebrow">Du ${r.from.toLocaleDateString("fr-FR")} au ${r.to.toLocaleDateString("fr-FR")}</span>
    <h2>${mode === "in" ? `+ ${eur.format(all.in / mo)} par mois en moyenne` : mode === "out" ? `− ${eur.format(all.out / mo)} par mois en moyenne` : `${state.tx.length} opérations`}</h2></div>`;
  return head + seg + (mode === "all" ? vOperations() : mode === "in" ? flowCard(r, "in") : (state.outBy === "name" ? flowCard(r, "out") : catCard(r))) + periodControl();
}

function catCard(r) {
  const list = Object.values(r.byCat).filter(c => c.total > 0).sort((a, b) => b.total - a.total);
  if (!list.length) return `<section class="card"><p class="muted">Aucune dépense sur la période.</p></section>`;
  const max = list[0].monthly;
  return `<section class="card" aria-labelledby="h-cat">
    <div class="card-head"><div><span class="eyebrow">Moyenne par mois</span><h2 id="h-cat">Par catégorie</h2></div></div>${outToggle("cat")}
    <div class="legend">${["ess", "uti", "sup"].map(l => `<span>${lvDot(l)}${LEVELS[l].label} <b class="num">${eur.format(r.lv[l] / r.months)}</b></span>`).join("")}</div>
    <div class="list">${list.map(c => {
      const open = state.openCat === c.id;
      const merchants = Object.entries(c.merchants).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => niceName(k)).join(", ");
      return `<div class="li tap" data-open-cat="${c.id}" role="button" tabindex="0" aria-expanded="${open}"><span class="t">${CAT[c.id].name} <span class="chev">${open ? "▲" : "▼"}</span></span><span class="amt">${eur.format(c.monthly)}</span>
        <span class="s">${pct(c.total / r.spend)} · ${esc(merchants)}</span>
        <div class="bar"><span style="width:${c.monthly / max * 100}%;background:var(--${c.level})"></span></div></div>
        ${open ? `<div class="sub-list"><div class="row" style="padding-block:10px"><span class="small muted">Niveau</span><span class="lvl" role="group" aria-label="Niveau de ${esc(CAT[c.id].name)}">${["ess", "uti", "sup"].map(l => `<button type="button" data-l="${l}" data-cat="${c.id}" aria-pressed="${c.level === l}">${LEVELS[l].label}</button>`).join("")}</span></div>
          <div class="list">${c.tx.slice(0, 60).map(txRow).join("")}</div></div>` : ""}`;
    }).join("")}</div>
  </section>`;
}
const outToggle = on => `<div class="seg small" role="group" aria-label="Regrouper par"><button type="button" data-outby="cat" aria-pressed="${on === "cat"}">Par catégorie</button><button type="button" data-outby="name" aria-pressed="${on === "name"}">Par nom</button></div>`;

// Entrées ou sorties regroupées par payeur ou bénéficiaire, avec ce que l'appli en fait.
function flowStatus(t) {
  const c = CAT[t.cat] || CAT.autre, P = state.profile || PROFILE_DEFAULT;
  if (t.amount > 0) {
    if (c.kind === "internal") return { id: "internal", label: "Entre vos comptes", tone: "info" };
    if (c.kind === "savings") return { id: "savings", label: "Retrait d'épargne", tone: "info" };
    if (c.kind === "pro") return { id: "pro", label: "Activité pro", tone: "info" };
    if (c.kind === "income") {
      if (P.onlyDeclared && P.incomes.length && !t.pf && t.cat !== "interets") return { id: "other", label: "Autre entrée", tone: "warn" };
      return t.cat === "interets" ? { id: "interest", label: "Intérêts", tone: "good" } : { id: "income", label: "Revenu", tone: "good" };
    }
    return { id: "refund", label: "Remboursement", tone: "info" };
  }
  if (c.kind === "internal") return { id: "internal", label: "Entre vos comptes", tone: "info" };
  if (c.kind === "savings") return { id: "savings", label: "Mis de côté", tone: "good" };
  if (c.kind === "pro") return { id: "pro", label: "Activité pro", tone: "info" };
  const l = state.levels[t.cat] || c.level;
  return { id: l, label: LEVELS[l].label, tone: l === "ess" ? "good" : l === "uti" ? "info" : "warn", level: l };
}
function flowCard(r, dir) {
  const mo = r.months || 1, groups = {}, byStatus = {};
  for (const t of r.txs || []) {
    if (dir === "in" ? t.amount <= 0 : t.amount >= 0) continue;
    const st = flowStatus(t), k = t.key + "|" + st.id + "|" + t.cat, v = Math.abs(t.amount);
    const g = groups[k] || (groups[k] = { k, key: t.key, cat: t.cat, st, total: 0, tx: [] });
    g.total += v; g.tx.push(t);
    const S = byStatus[st.id] || (byStatus[st.id] = { label: st.label, tone: st.tone, total: 0 }); S.total += v;
  }
  const list = Object.values(groups).sort((a, b) => b.total - a.total);
  return `<section class="card" aria-labelledby="h-fl">
    <div class="card-head"><div><span class="eyebrow">${dir === "in" ? "Par payeur" : "Par bénéficiaire"}</span><h2 id="h-fl">${dir === "in" ? "Argent reçu" : "Argent dépensé"}</h2></div></div>${dir === "out" ? outToggle("name") : ""}
    <div class="row">${Object.values(byStatus).filter(S => S.total / mo >= 1).sort((a, b) => b.total - a.total).map(S => `<span class="chip ${S.tone}">${esc(S.label)} ${eur.format(S.total / mo)} / mois</span>`).join("")}</div>
    ${dir === "in" ? `<p class="small muted">Seuls les « Revenus » comptent dans le reste à vivre. Les autres entrées sont listées pour que rien ne manque.</p>` : ""}
    <div class="list">${list.map(g => {
      const open = state.openFlow === g.k;
      return `<div class="li tap" data-flow-open="${esc(g.k)}" role="button" tabindex="0" aria-expanded="${open}"><span class="t">${esc(niceName(g.key))} <span class="chev">${open ? "▲" : "▼"}</span></span><span class="amt ${dir === "in" ? "pos" : ""}">${dir === "in" ? "+" : "−"}${eur.format(g.total)}</span>
        <span class="s"><span class="chip ${g.st.tone}">${esc(g.st.label)}</span>${dir === "out" && !(CAT[g.cat] || {}).kind ? esc(CAT[g.cat].name) + " · " : ""}${g.tx.length} op. · ${eur.format(g.total / mo)} / mois</span></div>
        ${open ? `<div class="sub-list"><div class="list">${g.tx.slice(0, 80).map(txRow).join("")}</div></div>` : ""}`;
    }).join("") || `<p class="muted">Aucune ${dir === "in" ? "entrée" : "sortie"} sur la période.</p>`}</div>
  </section>`;
}

function txRow(t) {
  const c = CAT[t.cat] || CAT.autre;
  const opts = CATS.map(x => `<option value="${x.id}"${x.id === t.cat ? " selected" : ""}>${x.name}</option>`).join("");
  return `<div class="li"><span class="t" style="font-weight:500">${esc(t.label)}</span><span class="amt ${t.amount > 0 ? "pos" : ""}">${t.amount > 0 ? "+" : "−"}${eur2.format(Math.abs(t.amount))}</span>
    <span class="s"><span class="num">${new Date(t.date).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" })}</span>${t.acct === "epargne" ? `<span class="chip info">Épargne</span>` : ""}${c.kind ? "" : lvDot(state.levels[t.cat] || c.level)}<select class="input" style="min-height:28px;padding:2px 6px;font-size:12px;width:auto;max-width:200px" aria-label="Catégorie" data-key="${esc(t.key)}">${opts}</select></span></div>`;
}

function vOperations() {
  const q = norm(state.search);
  let list = state.tx.filter(t => (!q || norm(t.label).includes(q)) && (!state.catFilter || t.cat === state.catFilter) && (!state.signFilter || (state.signFilter === "in" ? t.amount > 0 : t.amount < 0)));
  const n = list.length; if (!state.showAll) list = list.slice(0, 120);
  const used = [...new Set(state.tx.map(t => t.cat))].map(id => CAT[id]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, "fr"));
  return `<section class="card" aria-labelledby="h-op">
    <div class="card-head"><div><span class="eyebrow">${n} opération${n > 1 ? "s" : ""}</span><h2 id="h-op">Tout l'historique</h2></div></div>
    <div class="toolbar"><input class="input" type="search" id="search" placeholder="Rechercher un libellé" value="${esc(state.search)}" aria-label="Rechercher">
      <select class="input" id="sign-filter" aria-label="Entrées ou sorties"><option value="">+ et −</option><option value="in"${state.signFilter === "in" ? " selected" : ""}>+ Entrées</option><option value="out"${state.signFilter === "out" ? " selected" : ""}>− Sorties</option></select>
      <select class="input" id="cat-filter" aria-label="Filtrer par catégorie"><option value="">Toutes catégories</option>${used.map(c => `<option value="${c.id}"${state.catFilter === c.id ? " selected" : ""}>${c.name}</option>`).join("")}</select></div>
    <p class="small muted">Changez la catégorie d'une opération : toutes celles du même nom suivent, et l'appli s'en souvient.</p>
    <div class="list">${list.map(txRow).join("") || `<p class="muted">Aucune opération ne correspond.</p>`}</div>
    ${!state.showAll && n > 120 ? `<button class="btn" type="button" data-show-all>Afficher les ${n - 120} suivantes</button>` : ""}
  </section>`;
}

/* ------------------------------ Budgets ------------------------------ */
function vBudgets(r) {
  const months = budgetMonths(r);
  if (!months.includes(state.budgetMonth)) state.budgetMonth = months[0];

// Nom probable d'une charge ou d'un crédit introuvable : le bénéficiaire qui revient le plus souvent
// avec un montant proche (à 3 % près) de la mensualité saisie.
function nameGuess(x, sec) {
  const target = sec === "credits" ? x.monthly : x.manual;
  if (!(target > 0)) return null;
  const g = {};
  for (const t of state.tx) if (t.amount < 0 && Math.abs(-t.amount - target) <= target * 0.03) { const e = g[t.key] || (g[t.key] = { key: t.key, n: 0, sum: 0 }); e.n++; e.sum -= t.amount; }
  const best = Object.values(g).filter(e => e.n >= 2).sort((a, b) => b.n - a.n)[0];
  return best ? { key: best.key, n: best.n, amt: best.sum / best.n } : null;
}

// Fichier de classement : { "type": "budget-clair-classement", "overrides": { "NOM COMMERCANT": "categorie" } }.
// Il complète vos choix sans jamais remplacer une catégorie que vous avez déjà choisie.
function loadClassement(text, name) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return setStatus("Ce fichier n'est pas un fichier de classement valide.", "crit"); }
  const ov = data && data.type === "budget-clair-classement" && (data.overrides || {});
  if (!ov || typeof ov !== "object") return setStatus("Ce fichier n'est pas un fichier de classement Budget Clair.", "crit");
  let pfAdded = 0;
  if (data.profile && typeof data.profile === "object") {
    if (!state.profile) state.profile = loadProfile();
    for (const sec of ["incomes", "charges", "credits"]) for (const x of data.profile[sec] || []) {
      if (!x || typeof x.label !== "string" || state.profile[sec].some(y => norm(y.label) === norm(x.label))) continue;
      state.profile[sec].push({ id: newId(), label: x.label, match: String(x.match || ""), manual: x.manual ?? null, monthly: x.monthly ?? null, end: x.end || "", cat: CAT[x.cat] ? x.cat : undefined });
      pfAdded++;
    }
    if (typeof data.profile.onlyDeclared === "boolean") state.profile.onlyDeclared = data.profile.onlyDeclared;
    saveProfile();
  }
  let added = 0, kept = 0;
  for (const [k, cat] of Object.entries(ov)) {
    if (!CAT[cat] || typeof k !== "string") continue;
    if (state.overrides[k]) { kept++; continue; }
    state.overrides[k] = cat; added++;
  }
  store.set("overrides", state.overrides);
  setStatus(`<b>${esc(name)}</b> : ${added} nom${added > 1 ? "s" : ""} classé${added > 1 ? "s" : ""}${kept ? `, ${kept} déjà classé${kept > 1 ? "s" : ""} par vous (inchangé${kept > 1 ? "s" : ""})` : ""}${pfAdded ? `, ${pfAdded} ligne${pfAdded > 1 ? "s" : ""} ajoutée${pfAdded > 1 ? "s" : ""} dans « Mon budget »` : ""}.`);
  recompute();
}
function handleFile(f) {
  const rd = new FileReader();
  const isPdf = /\.pdf$/i.test(f.name) || f.type === "application/pdf";
  rd.onload = () => {
    const head = new Uint8Array(rd.result.slice(0, 8));
    const magic = String.fromCharCode(...head.slice(0, 5));
    if (/\.json$/i.test(f.name) || f.type === "application/json") return loadClassement(decode(rd.result), f.name);
    if (isPdf || magic === "%PDF-") loadPdf(rd.result, f.name);
    else if (magic.startsWith("PK\x03\x04") || /\.(xlsx|xlsm)$/i.test(f.name)) loadExcel(rd.result, f.name);
    else if (head[0] === 0xd0 && head[1] === 0xcf && head[2] === 0x11 && head[3] === 0xe0) setStatus("Ce fichier est au format Excel ancien (.xls). Ouvrez-le dans Excel ou Google Sheets, enregistrez-le en .xlsx ou en CSV, puis importez-le à nouveau.", "crit");
    else loadText(decode(rd.result), f.name, false);
  };
  rd.onerror = () => setStatus("Impossible de lire ce fichier. Réessayez ou exportez-le à nouveau depuis votre banque.", "crit");
  rd.readAsArrayBuffer(f);
}

  }
  if (q("[data-suggest]")) { state.budgets = suggestBudgets(state.res); store.set("budgets", state.budgets); return keepScroll(render); }
  if (q("[data-clear-budgets]")) { $("#clear-box").innerHTML = `<span class="small">Supprimer tous vos budgets&nbsp;?</span> <button class="btn small danger" type="button" data-clear-yes>Oui</button> <button class="btn small ghost" type="button" data-clear-no>Non</button>`; return; }
  if (q("[data-clear-yes]")) { state.budgets = {}; store.set("budgets", state.budgets); return keepScroll(render); }
  if (q("[data-clear-no]")) return keepScroll(render);
  if (q("[data-wipe]")) { $("#wipe-box").innerHTML = `<span class="small">Effacer l'historique, vos catégories, vos budgets et « Mon budget »&nbsp;?</span><button class="btn small danger" type="button" data-wipe-yes>Oui, effacer</button><button class="btn small ghost" type="button" data-wipe-no>Annuler</button>`; return; }
  if (q("[data-wipe-yes]")) { store.clear(); Object.assign(state, { overrides: {}, levels: {}, budgets: {}, metas: {}, profile: loadProfile(), tx: [], rows: null, sample: false }); setStatus(""); $("#mapping").hidden = true; state.res = analyse([], state.levels); return goTab("accueil"); }
  if (q("[data-wipe-no]")) return keepScroll(render);
});
view.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open-cat], [data-flow-open]")) { e.preventDefault(); e.target.click(); } });
view.addEventListener("change", e => {
  const s = e.target;
  if (s.dataset.key) { state.overrides[s.dataset.key] = s.value; store.set("overrides", state.overrides); return keepScroll(recompute); }
  if (s.id === "period") { state.period = s.value; store.set("period", state.period); state.budgetMonth = null; state.month = null; return keepScroll(recompute); }
  if (s.id === "cat-filter") { state.catFilter = s.value; return keepScroll(render); }
  if (s.id === "sign-filter") { state.signFilter = s.value; state.showAll = false; return keepScroll(render); }
  if (s.dataset.pf || s.id === "pf-only" || s.id === "pf-savings") {
    if (s.id === "pf-only") state.profile.onlyDeclared = s.checked;
    else if (s.id === "pf-savings") { const v = parseAmount(s.value); state.profile.savingsNow = isNaN(v) ? null : Math.abs(v); }
    else {
      const [sec, i, f] = s.dataset.pf.split("|"), row = state.profile[sec][+i];
      (state.pfOpen || (state.pfOpen = {}))[sec + "|" + i] = true; // le volet « Modifier » reste ouvert pendant la saisie
      if (["manual", "monthly"].includes(f)) { const v = parseAmount(s.value); row[f] = isNaN(v) ? null : Math.abs(v); }
      else row[f] = s.value.trim();
    }
    saveProfile(); return keepScroll(recompute);
  }
  if (s.dataset.budget) { const v = parseAmount(s.value); setBudget(s.dataset.budget, isNaN(v) ? 0 : Math.abs(v)); return keepScroll(render); }
});
view.addEventListener("input", e => {
  if (e.target.id !== "search") return;
  state.search = e.target.value; const pos = e.target.selectionStart; keepScroll(render);
  const i = $("#search"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => state.tab === "accueil" && state.res && drawMonthly(state.res), 150); });

    for (let i = 0; i < 6; i++) f(D(2 + i * 4), ["CB MCDONALDS", "CB STARBUCKS", "CB BRASSERIE DU COIN", "CB PAUL GARE"][i % 4], -(6 + rnd() * 18));
    for (let i = 0; i < 8; i++) f(D(1 + i * 3), "CB TABAC LE CELTIC", -(2.5 + rnd() * 9));
    f(D(12), "CB TOTALENERGIES STATION", -(55 + rnd() * 10));
    f(D(16), "CB SNCF CONNECT", -(35 + rnd() * 30));

/* ============================== Démarrage ============================== */
(function boot() {
  let hist = store.get("history", null);
  const last = store.get("last", null); // ancienne version : un seul relevé gardé
  if (!hist && last && Array.isArray(last.tx)) { hist = last.tx; store.set("history", hist); }
  if (hist && hist.length) {
    state.tx = hist;
    recompute();
  } else { state.profile = loadProfile(); render(); }
  // Relevé partagé depuis une autre appli (Android, appli installée) : le service worker l'a mis de côté.
  if (/[?&]shared=1/.test(location.search) && "caches" in window) {
    caches.open("budget-clair-share").then(c => c.match("shared-file").then(res => {
      if (!res) return;
      const name = decodeURIComponent(res.headers.get("x-file-name") || "releve");
      return res.blob().then(b => { c.delete("shared-file"); handleFile(new File([b], name, { type: b.type })); });
    })).catch(() => {}).finally(() => { try { history.replaceState(null, "", location.pathname); } catch (e) {} });
  }
  try { state.standalone = window.matchMedia("(display-mode: standalone)").matches && /Android/i.test(navigator.userAgent); } catch (e) {}
  try {
    if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {});
  } catch (e) {}
})();
