    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}

function guessMapping(rows, headerIdx) {
  const header = headerIdx >= 0 ? rows[headerIdx].map(low) : [];
  const data = rows.slice(headerIdx + 1);
  const ncol = Math.max(...rows.map(r => r.length));
  const map = {}; const used = new Set();
  const take = (k, allowExcluded) => {
    for (const r of HEAD_RULES[k]) {
      for (let c = 0; c < header.length; c++) {
        if (used.has(c) && k !== "bankcat") continue;
        const h = header[c];
        if (!allowExcluded && HEAD_EXCLUDE.test(h) && !(k === "date" && /op/.test(h))) continue;
        if (r.test(h)) { map[k] = c; used.add(c); return; }
      }
    }
  };
  if (header.length) {
    take("date"); take("amount"); take("debit"); take("credit"); take("bankcat"); take("type"); take("state"); take("product"); take("fee", true); take("label"); take("detail");
    if (map.bankcat == null) take("bankcat", true);
  }
  // Complément par les données si l'en-tête ne suffit pas
  const stats = [];
  for (let c = 0; c < ncol; c++) {
    const vals = data.slice(0, 200).map(r => r[c] || "").filter(Boolean);
    const n = vals.length || 1;
    stats.push({
      c, filled: vals.length / Math.max(1, Math.min(200, data.length)),
      date: vals.filter(v => parseDate(v)).length / n,
      num: vals.filter(v => !isNaN(parseAmount(v))).length / n,
      neg: vals.filter(v => parseAmount(v) < 0).length / n,
      len: vals.reduce((a, v) => a + v.length, 0) / n
    });
  }
  const free = s => !Object.values(map).includes(s.c);
  if (map.date == null) { const s = stats.filter(free).filter(s => s.date > .8).sort((a, b) => b.date - a.date)[0]; if (s) map.date = s.c; }
  if (map.amount == null && map.debit == null) {
    const s = stats.filter(free).filter(s => s.num > .8 && s.neg > 0).sort((a, b) => b.filled - a.filled)[0];
    if (s) map.amount = s.c;
  }
  if (map.label == null) { const s = stats.filter(free).filter(s => s.date < .5 && s.num < .5).sort((a, b) => b.len - a.len)[0]; if (s) map.label = s.c; }
  return map;
}

function buildTransactions(rows, headerIdx, map, invert) {
  const out = [], plans = []; let skipped = 0;
  for (const r of rows.slice(headerIdx + 1)) {
    const date = parseDate(r[map.date]);
    const pm = /abonnement\s+(standard|plus|premium|metal|ultra)\b/i.exec(r[map.label] || "");
    let amt = NaN;
    if (map.amount != null) amt = parseAmount(r[map.amount]);
    if (isNaN(amt) && (map.debit != null || map.credit != null)) {
      const d = map.debit != null ? parseAmount(r[map.debit]) : NaN;
      const c = map.credit != null ? parseAmount(r[map.credit]) : NaN;
      if (!isNaN(d) && d !== 0) amt = -Math.abs(d);
      else if (!isNaN(c) && c !== 0) amt = Math.abs(c);
    }
    if (map.state != null) {
      const st = low(r[map.state]);
      if (/revert|renvoy|declin|failed|annul|refus|pending|en attente|en cours/.test(st)) { skipped++; continue; }
    }
    if (pm && date && !isNaN(amt)) plans.push({ plan: pm[1].toLowerCase(), date: date.getTime(), amount: Math.abs(amt) });
    if (!date || isNaN(amt) || amt === 0) { skipped++; continue; }
    if (invert) amt = -amt;
    const label = [r[map.label], map.detail != null ? r[map.detail] : ""].filter(Boolean).join(" · ") || "(sans libellé)";
    out.push({
      date: date.getTime(), amount: Math.round(amt * 100) / 100, label,
      type: map.type != null ? (r[map.type] || "") : "",
      bankcat: map.bankcat != null ? (r[map.bankcat] || "") : "",
      acct: map.product != null && /savings|epargne|épargne|livret|coffre|vault|d[ée]p[ôo]t|deposit/i.test(r[map.product] || "") ? "epargne" : ""
    });
    // Frais facturés à part (colonne « Frais » de Revolut) : une opération de frais bancaires distincte.
    const fee = map.fee != null ? parseAmount(r[map.fee]) : NaN;
    if (!isNaN(fee) && fee !== 0) out.push({ date: date.getTime(), amount: -Math.round(Math.abs(fee) * 100) / 100, label: "Frais · " + label, type: "", bankcat: "", acct: out[out.length - 1].acct, forceCat: "frais" });
  }
  out.sort((a, b) => b.date - a.date);
  return { tx: out, skipped, plans };
}

/* ============================== Lecture PDF ============================== */
// pdf.js est téléchargé une seule fois depuis cdnjs, puis gardé en cache pour le hors-ligne.
// Le PDF lui-même est lu dans la page : son contenu ne part nulle part.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady = null;
function loadScript(src) {
  return new Promise((ok, ko) => {
    const el = document.createElement("script");
    el.src = src; el.crossOrigin = "anonymous"; el.onload = ok; el.onerror = () => ko(new Error("script"));
    document.head.appendChild(el);
  });
}
function loadPdfJs() {
  // Le « worker » est chargé comme un script ordinaire : pdf.js l'exécute alors dans la page,
  // ce qui évite un Worker d'une autre origine (refusé par les navigateurs) et marche hors-ligne.
  if (!pdfReady) pdfReady = loadScript(PDFJS + "pdf.worker.min.js")
    .then(() => loadScript(PDFJS + "pdf.min.js"))
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; return window.pdfjsLib; })
    .catch(e => { pdfReady = null; throw e; });
  return pdfReady;
}

const AMT_RE = /^[-+−]?\s?(?:€|EUR|\$|£)?\s?\d{1,3}(?:[\s  .]\d{3})*[,.]\d{2}\s?(?:€|EUR)?\s?[-+]?$|^[-+−]?\s?(?:€|EUR|\$|£)?\s?\d+[,.]\d{2}\s?(?:€|EUR)?$/;
const AMT_TAIL = /^(.*\S)\s+([-+−]?(?:€|\$|£)?\d{1,3}(?:[\s  .]\d{3})*,\d{2}|[-+−]?(?:€|\$|£)?\d+[.,]\d{2})\s?(?:€|EUR)?$/;
const SHORT_DATE = /^\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?$/;
const MONTH_NAMES = { JAN: 1, JANV: 1, JANVIER: 1, JANUARY: 1, FEV: 2, FEVR: 2, FEVRIER: 2, FEB: 2, FEBRUARY: 2, MAR: 3, MARS: 3, MARCH: 3, AVR: 4, AVRIL: 4, APR: 4, APRIL: 4, MAI: 5, MAY: 5, JUIN: 6, JUN: 6, JUNE: 6, JUIL: 7, JUILLET: 7, JUL: 7, JULY: 7, AOU: 8, AOUT: 8, AUG: 8, AUGUST: 8, SEP: 9, SEPT: 9, SEPTEMBRE: 9, SEPTEMBER: 9, OCT: 10, OCTOBRE: 10, OCTOBER: 10, NOV: 11, NOVEMBRE: 11, NOVEMBER: 11, DEC: 12, DECEMBRE: 12, DECEMBER: 12 };
const PDF_SKIP = /^(SOLDE|ANCIEN SOLDE|NOUVEAU SOLDE|TOTAL|TOTAUX|SOUS TOTAL|REPORT|BALANCE|OPENING|CLOSING|MONTANT|DATE)\b/;

// Date en tête de ligne : « 03/08 », « 03/08/2026 », « 3 août 2026 », « 3 Aug 2026 ».
function leadingDate(text) {
  let m = text.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?(?=\s|$)/);
  if (m) return { d: +m[1], m: +m[2], y: m[3] ? (+m[3] < 100 ? +m[3] + 2000 : +m[3]) : null, len: m[0].length };
  m = text.match(/^(\d{1,2})\s+([A-Za-zÀ-ÿ]{3,9})\.?(?:\s+(\d{4}))?(?=\s|$)/);
  if (m) { const mo = MONTH_NAMES[norm(m[2])]; if (mo) return { d: +m[1], m: mo, y: m[3] ? +m[3] : null, len: m[0].length }; }
  return null;
}

async function pdfToLines(buf) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const out = []; let chars = 0;
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || 8 }));
    items.forEach(i => chars += i.s.length);
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      const L = lines.slice(-3).find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.4));
      if (L) L.items.push(it); else lines.push({ y: it.y, page: p, items: [it] });
    }
    for (const L of lines) {
      L.items.sort((a, b) => a.x - b.x);
      const toks = [];
      for (const it of L.items) {
        const prev = toks[toks.length - 1];
        const gap = prev ? it.x - prev.r : Infinity;
        if (prev && gap < it.h * 0.25) { prev.s += it.s; prev.r = it.x + it.w; }
        else if (prev && gap < it.h * 0.7 && /^[-+−]?\d{1,3}$/.test(prev.s.trim()) && /^\d{3}([.,]\d{2})?/.test(it.s.trim())) { prev.s += " " + it.s; prev.r = it.x + it.w; }
        else toks.push({ s: it.s, x: it.x, r: it.x + it.w });
      }
      // Un bloc « libellé … 23,40 » dans un seul morceau de texte : on sépare le montant.
      const split = [];
      for (const t of toks) {
        const s = t.s.trim(), m = s.match(AMT_TAIL);
        if (m && !AMT_RE.test(s)) {
          const cut = t.x + (t.r - t.x) * (m[1].length / s.length);
          split.push({ s: m[1], x: t.x, r: cut }, { s: m[2], x: cut, r: t.r });
        } else split.push({ s, x: t.x, r: t.r });
      }
      L.toks = split.filter(t => t.s);
      L.text = L.toks.map(t => t.s).join(" ").replace(/\s+/g, " ").trim();
      out.push(L);
    }
  }
  return { lines: out, chars };
}

// Certains relevés (Revolut) écrivent une opération sur 2 ou 3 lignes très serrées :
// « 2 sept. » / « 2026 » dans la colonne Date, le montant entre les deux, « € » en dessous.
// On regroupe ces lignes serrées en une seule, colonne par colonne. Une ligne qui commence
// par une date ouvre toujours une nouvelle opération.
function mergeBlocks(lines) {
  const blocks = []; let cur = null;
  for (const L of lines) {
    const h = Math.max(...L.items.map(i => i.h)) || 8;
    if (cur && L.page === cur.page && !leadingDate(L.text) && cur.lastY - L.y <= h * 1.15 + 1) { cur.parts.push(L); cur.lastY = L.y; continue; }
    cur = { page: L.page, y: L.y, lastY: L.y, parts: [L] }; blocks.push(cur);
  }
  return blocks.map(B => {
    if (B.parts.length === 1) { B.parts[0].lastY = B.parts[0].y; return B.parts[0]; }
    const cols = [];
    for (const L of B.parts) for (const t of L.toks) {
      const c = cols.find(c => t.x < c.r + 2 && t.r > c.x - 2);
      if (c) { c.s += " " + t.s; c.x = Math.min(c.x, t.x); c.r = Math.max(c.r, t.r); } else cols.push({ s: t.s, x: t.x, r: t.r });
    }
    cols.sort((a, b) => a.x - b.x);
    return { y: B.y, lastY: B.lastY, page: B.page, items: B.parts.flatMap(p => p.items), toks: cols, text: cols.map(c => c.s).join(" ").replace(/\s+/g, " ").trim() };
  });
}

// Informations du relevé utiles à l'analyse : type de compte, taux, soldes, impôt retenu.
function pdfMeta(lines, name) {
  const all = lines.map(L => L.text).join(" ");
  const amtAfter = re => { const m = all.match(new RegExp(re.source + "\\s*:?\\s*([-−]?\\s?\\d{1,3}(?:[\\s.]\\d{3})*,\\d{2}|[-−]?\\d+[.,]\\d{2})", "i")); return m ? parseAmount(m[1]) : null; };
  const num = re => { const m = all.match(re); return m ? parseFloat(m[1].replace(",", ".")) : null; };
  const head = norm(lines.slice(0, 12).map(L => L.text).join(" "));
  const meta = {
    acct: /RELEVE D EPARGNE|SAVINGS STATEMENT|RELEVE DE (COMPTE )?LIVRET|RELEVE DE COMPTE D EPARGNE/.test(head) || /savings|epargne|épargne|livret/i.test(name) ? "epargne" : "",
    rate: num(/(?:taux d['’]int[ée]r[êe]t(?: brut| annuel| nominal)?|gross interest rate|interest rate|AER)\s*:?\s*(\d+(?:[.,]\d+)?)\s?%/i),
    pfu: num(/pr[ée]l[èe]vement forfaitaire\s+(?:lib[ée]ratoire\s+|unique\s+)?(?:de\s+)?(\d+(?:[.,]\d+)?)\s?%/i),
    open: amtAfter(/(?:solde d['’]ouverture|opening balance|ancien solde)/),
    close: amtAfter(/(?:solde de cl[ôo]ture|closing balance|nouveau solde)/)
  };
  const it = amtAfter(/imp[ôo]t sur le revenu retenu/), soc = amtAfter(/(?:surtaxes sociales retenues|pr[ée]l[èe]vements sociaux retenus)/);
  meta.taxWithheld = it == null && soc == null ? null : (it || 0) + (soc || 0);
  return meta;
}

function pdfLinesToRows(lines) {
  // Date de fin du relevé : la date complète la plus récente du document (sert à dater « 03/08 »).
  let ref = null;
  for (const L of lines) for (const m of L.text.matchAll(/\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})\b|\b(\d{1,2})\s+([A-Za-zÀ-ÿ]{3,9})\.?\s+(\d{4})\b/g)) {
    const mo = m[1] ? +m[2] : MONTH_NAMES[norm(m[5])];
    if (!mo || mo > 12) continue;
    const d = m[1] ? new Date(+m[3], mo - 1, +m[1]) : new Date(+m[6], mo - 1, +m[4]);
    if (!isNaN(d) && d.getFullYear() > 1990 && d.getFullYear() < 2100 && (!ref || d > ref)) ref = d;
  }
  if (!ref) ref = new Date();
  lines = mergeBlocks(lines);
  const rows = [["Date", "Libellé", "Montant"]];
  let cols = null, guessed = 0, prevTx = null, headerSeen = false;
  const colOf = (t, c) => Math.min(Math.abs((t.x + t.r) / 2 - c.c), Math.abs(t.r - c.r));
  for (const L of lines) {
    const lt = L.toks.map(t => low(t.s));
    const deb = L.toks.find((t, i) => /^(debit|debits|montant debit|sorties?|money out|paid out|retraits?|depenses?|argent sortant|sortant)\b/.test(lt[i]));
    const cre = L.toks.find((t, i) => /^(credit|credits|montant credit|entrees?|money in|paid in|versements?|recettes?|argent entrant|entrant)\b/.test(lt[i]));
    if (deb && cre) {
      const bal = L.toks.find((t, i) => /^(solde|balance)\b/.test(lt[i]));
      cols = { deb: { c: (deb.x + deb.r) / 2, r: deb.r }, cre: { c: (cre.x + cre.r) / 2, r: cre.r }, bal: bal ? { c: (bal.x + bal.r) / 2, r: bal.r } : null };
      headerSeen = true; prevTx = null; continue;
    }
    const dt = leadingDate(L.text);
    const amts = L.toks.filter((t, i) => i > 0 && AMT_RE.test(t.s));
    if (!dt || !amts.length) {
      // Libellé sur deux lignes : la ligne suivante, sans date ni montant, complète le précédent.
      if (prevTx && !dt && !amts.length && L.page === prevTx.page && L.text.length < 70 && prevTx.lastY - L.y <= (Math.max(...L.items.map(i => i.h)) || 8) * 2.2 && L.toks[0].x > prevTx.x0 + 5 && !PDF_SKIP.test(norm(L.text)) && prevTx.extra < 1) { prevTx.row[1] += " " + L.text; prevTx.extra++; prevTx.lastY = L.lastY; }
      else prevTx = null;
      continue;
    }
    let label = L.text.slice(dt.len).trim();
    for (const a of amts) label = label.replace(a.s, " ");
    label = label.split(" ").filter(w => !SHORT_DATE.test(w) && !/^\d+(?:[.,]\d+)?%$/.test(w)).join(" ").replace(/\s+/g, " ").replace(/^[-–:·\s]+|[-–:·\s€]+$/g, "").trim();
    if (!label || PDF_SKIP.test(norm(label))) { prevTx = null; continue; }
    let pick = null, sign = 0;
    if (cols) {
      let best = Infinity;
      for (const a of amts) for (const k of ["deb", "cre", "bal"]) {
        if (!cols[k]) continue;
        const d = colOf(a, cols[k]);
        if (d < best) { best = d; pick = a; sign = k === "deb" ? -1 : k === "cre" ? 1 : 0; }
      }
      if (sign === 0) { // le plus proche est le solde : prendre l'autre montant de la ligne
        const others = amts.filter(a => a !== pick);
        if (others.length) { pick = others[0]; sign = colOf(pick, cols.deb) <= colOf(pick, cols.cre) ? -1 : 1; } else pick = null;
      }
    } else {
      pick = amts.length >= 2 ? amts[amts.length - 2] : amts[0];
    }
    if (!pick) { prevTx = null; continue; }
    const v = parseAmount(pick.s);
    if (isNaN(v) || v === 0) { prevTx = null; continue; }
    if (/^[-−]|-$/.test(pick.s.trim())) sign = -1;
    else if (/^\+/.test(pick.s.trim())) sign = 1;
    if (!sign) { guessed++; sign = /\b(VIR(EMENT)? (RECU|DE|EN VOTRE FAVEUR)|SALAIRE|REMBOURSEMENT|REMB|AVOIR|CAF|CPAM|VERSEMENT|DEPOT|REFUND)\b/.test(norm(label)) ? 1 : -1; }
    let y = dt.y;
    if (!y) { y = ref.getFullYear(); if (dt.m > ref.getMonth() + 1) y--; }
    const iso = `${y}-${String(dt.m).padStart(2, "0")}-${String(dt.d).padStart(2, "0")}`;
    const row = [iso, label, (sign * Math.abs(v)).toFixed(2)];
    rows.push(row); prevTx = { row, page: L.page, extra: 0, lastY: L.lastY, x0: L.toks[0].x };
  }
  return { rows, headerSeen, guessed };
}

async function loadPdf(buf, name) {
  setStatus("Lecture du PDF…");
  let res;
  try { res = await pdfToLines(buf); }
  catch (e) {
    if (e && e.name === "PasswordException") return setStatus("Ce PDF est protégé par un mot de passe. Téléchargez une version sans mot de passe depuis votre banque, ou utilisez l'export CSV.", "crit");
    if (e && e.message === "script") return setStatus("Le lecteur de PDF n'a pas pu être téléchargé. Ouvrez l'appli une première fois avec une connexion Internet : il reste ensuite disponible hors-ligne. Les fichiers CSV marchent sans connexion.", "crit");
    return setStatus("Ce fichier PDF n'a pas pu être ouvert. Vérifiez qu'il n'est pas abîmé, ou utilisez l'export CSV de votre banque.", "crit");
  }
  if (res.chars < 40) return setStatus("Ce PDF ne contient pas de texte : c'est probablement un document scanné. Téléchargez le relevé directement depuis l'appli de la banque, ou utilisez l'export CSV.", "crit");
  const { rows, headerSeen, guessed } = pdfLinesToRows(res.lines);
  if (rows.length < 2) return setStatus("Je n'ai pas trouvé de tableau d'opérations dans ce PDF (lignes qui commencent par une date et contiennent un montant). L'export CSV de votre banque sera plus fiable.", "crit");
  const note = guessed ? `Colonnes Débit / Crédit non trouvées pour ${guessed} opération${guessed > 1 ? "s" : ""} : leur sens (dépense ou entrée) a été deviné d'après le libellé. Vérifiez dans l'onglet Opérations.` : (!headerSeen ? "Relevé PDF lu sans en-tête de colonnes : vérifiez quelques montants dans l'onglet Opérations." : "");
  const meta = pdfMeta(res.lines, name);
  if (meta.acct) { state.metas[name] = { ...meta, at: Date.now() }; store.set("metas", state.metas); }
  Object.assign(state, { rows, headerIdx: 0, map: { date: 0, label: 1, amount: 2 }, file: name, fileAcct: meta.acct, fileBank: /REVOLUT/.test(norm(res.lines.slice(0, 60).map(L => L.text).join(" "))) ? "revolut" : "", sample: false, invert: false, showAll: false, openCat: null, catFilter: "", pdfNote: note, infoNote: "", histBefore: store.get("history", []) });
  applyMapping();
}

/* ============================== Lecture Excel (.xlsx) ============================== */
// Un fichier .xlsx est une archive ZIP de fichiers XML. On l'ouvre ici avec les outils du
// navigateur (DecompressionStream, DOMParser) : aucune bibliothèque, rien n'est envoyé.
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("zip");
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("zip");
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), flags = dv.getUint16(p + 8, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    files[name] = { method, csize, off, encrypted: !!(flags & 1) };
    p += 46 + nlen + xlen + clen;
  }
  const read = async name => {
    const f = files[name]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    if (f.method !== 8 || typeof DecompressionStream === "undefined") throw new Error("zip");
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  };
  return { names: Object.keys(files), read };
}

const xmlEls = (node, tag) => Array.from(node.getElementsByTagNameNS("*", tag));
const xmlParse = s => new DOMParser().parseFromString(s, "application/xml");
// Certains exports (Revolut) contiennent un texte encodé deux fois (« DÃ©but ») et des
// caractères échappés (« _x0089_ ») : on les remet d'aplomb.
function fixText(s) {
  s = s.replace(/_x([0-9A-Fa-f]{4})_/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
  if (/[ÃÂ][\u0080-¿]/.test(s) && !/[^\u0000-ÿ]/.test(s)) {
    try { return new TextDecoder("utf-8", { fatal: true }).decode(Uint8Array.from(s, c => c.charCodeAt(0))); } catch (e) { /* texte d'origine */ }
  }
  return s;
}
const colIndex = ref => { let n = 0; for (const ch of ref.replace(/\d+$/, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
function isDateFormat(id, code) {
  if ((id >= 14 && id <= 22) || (id >= 45 && id <= 47) || (id >= 27 && id <= 36) || (id >= 50 && id <= 58)) return true;
  if (!code) return false;
  const c = code.replace(/"[^"]*"/g, "").replace(/\[[^\]]*\]/g, "").replace(/\\./g, "");
  return /[dy]/i.test(c) && !/^general$/i.test(c);
}

async function readXlsx(buf) {
  const z = await unzip(buf);
  if (z.names.includes("EncryptedPackage")) throw new Error("password");
  const wbXml = await z.read("xl/workbook.xml");
  if (!wbXml) throw new Error("zip");
  const wb = xmlParse(wbXml);
  const date1904 = xmlEls(wb, "workbookPr").some(e => /^(1|true)$/.test(e.getAttribute("date1904") || ""));
  const sheetNames = xmlEls(wb, "sheet").map(e => e.getAttribute("name"));
  const rels = {}, relXml = await z.read("xl/_rels/workbook.xml.rels");
  if (relXml) for (const e of xmlEls(xmlParse(relXml), "Relationship")) rels[e.getAttribute("Id")] = e.getAttribute("Target");
  const sheetFiles = xmlEls(wb, "sheet").map((e, i) => {
    const t = rels[e.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") || e.getAttribute("r:id")];
    return t ? "xl/" + t.replace(/^\/?xl\//, "").replace(/^\//, "") : `xl/worksheets/sheet${i + 1}.xml`;
  });
  const shared = [], ssXml = await z.read("xl/sharedStrings.xml");
  if (ssXml) for (const si of xmlEls(xmlParse(ssXml), "si")) shared.push(fixText(xmlEls(si, "t").map(t => t.textContent).join("")));
  const dateStyles = [], stXml = await z.read("xl/styles.xml");
  if (stXml) {
    const st = xmlParse(stXml), fmts = {};
    for (const f of xmlEls(st, "numFmt")) fmts[f.getAttribute("numFmtId")] = f.getAttribute("formatCode");
    const xfs = xmlEls(st, "cellXfs")[0];
    if (xfs) xmlEls(xfs, "xf").forEach((xf, i) => { const id = +xf.getAttribute("numFmtId") || 0; dateStyles[i] = isDateFormat(id, fmts[id]); });
  }
  const serialToIso = v => {
    const d = new Date(Date.UTC(date1904 ? 1904 : 1899, date1904 ? 0 : 11, date1904 ? 1 : 30) + Math.round(v * 864e5));
    return d.toISOString().slice(0, 10);
  };
  const sheets = [];
  for (let i = 0; i < sheetFiles.length; i++) {
    const xml = await z.read(sheetFiles[i]); if (!xml) continue;
    const rows = [];
    for (const row of xmlEls(xmlParse(xml), "row")) {
      const out = [];
      for (const c of xmlEls(row, "c")) {
        const t = c.getAttribute("t"), vEl = xmlEls(c, "v")[0], v = vEl ? vEl.textContent : "";
        let val = v;
        if (t === "s") val = shared[+v] || "";
        else if (t === "inlineStr") val = fixText(xmlEls(c, "t").map(x => x.textContent).join(""));
        else if (t === "str") val = fixText(v);
        else if (t === "b") val = v === "1" ? "VRAI" : "FAUX";
        else if (t === "e") val = "";
        else if (v !== "" && dateStyles[+c.getAttribute("s") || 0] && isFinite(+v)) val = serialToIso(+v);
        out[colIndex(c.getAttribute("r") || "A1")] = String(val).trim();
      }
      for (let k = 0; k < out.length; k++) if (out[k] == null) out[k] = "";
      if (out.some(Boolean)) rows.push(out);
    }
    sheets.push({ name: sheetNames[i] || "Feuille " + (i + 1), rows });
  }
  return sheets;
}

async function loadExcel(buf, name) {
  setStatus("Lecture du fichier Excel…");
  let sheets;
  try { sheets = await readXlsx(buf); }
  catch (e) {
    if (e && e.message === "password") return setStatus("Ce fichier Excel est protégé par un mot de passe. Enregistrez-le sans mot de passe, ou utilisez l'export CSV de votre banque.", "crit");
    return setStatus("Ce fichier Excel n'a pas pu être ouvert. S'il s'agit d'un ancien format .xls, enregistrez-le en .xlsx ou en CSV depuis Excel ou Google Sheets.", "crit");
  }
  let best = null;
  for (const sh of sheets) {
    if (sh.rows.length < 2) continue;
    const h = findHeaderRow(sh.rows), map = guessMapping(sh.rows, h);
    const ok = map.date != null && map.label != null && (map.amount != null || map.debit != null || map.credit != null);
    const score = (ok ? 1e7 : 0) + sh.rows.length;
    if (!best || score > best.score) best = { ...sh, h, map, score };
  }
  if (!best) return setStatus("Ce fichier Excel ne contient pas de tableau d'opérations lisible.", "crit");
  Object.assign(state, { rows: best.rows, headerIdx: best.h, map: best.map, file: name, fileBank: "", sample: false, invert: false, showAll: false, openCat: null, catFilter: "", pdfNote: "",
    infoNote: sheets.length > 1 ? `Feuille utilisée : « ${esc(best.name)} ».` : "",
    fileAcct: /savings|epargne|épargne|livret/i.test(name) ? "epargne" : "", histBefore: store.get("history", []) });
  applyMapping();
}

/* ============================== Classement ============================== */
const PREFIX = /^(CB|CARTE|CARTE X?\w*|PAIEMENT PAR CARTE|PAIEMENT CB|ACHAT CB|PAIEMENT|ACHAT|FACTURE CARTE|PRLV SEPA|PRLV|PRELEVEMENT SEPA|PRELEVEMENT|PRELEVEMENT EUROPEEN|VIR SEPA|VIREMENT SEPA|VIR INST|VIR|VIREMENT|VIREMENT EN VOTRE FAVEUR|AVOIR|RETRAIT DAB|DU|DE|EMIS|RECU|PAIEMENT ENVOYE PAR|ENVOYE PAR|PAYMENT FROM|VIREMENT A|VIREMENT DE|VIR A|VIR DE|TO|FROM|RETRAIT D ESPECES A|RETRAIT D ESPECES|SUR LA|A PARTIR DE|A)\s+/;
function merchantKey(label) {
  let s = norm(label), prev;
  do { prev = s; s = s.replace(PREFIX, ""); } while (s !== prev);
  const words = s.split(" ").filter(w => !/\d/.test(w) && w.length > 1 && !/^(SAS|SARL|SA|FR|FRANCE|PARIS|LYON|MARSEILLE|WWW|COM|HTTPS)$/.test(w));
  return words.slice(0, 2).join(" ") || norm(label).slice(0, 20);
}

function ruleCategory(t) {
  const text = norm(t.type + " " + t.label);
  const pos = t.amount > 0;
  for (const c of CATS) {
    if (!c.re) continue;
    if (c.onlyPositive && !pos) continue;
    if (c.id === "revenus" && !pos) continue;
    if (c.onlyNegative && pos) continue;
    if (c.re.test(text)) return c.id;
  }
  if (t.bankcat) {
    const b = low(t.bankcat);
    for (const [re, id] of BANK_CAT_MAP) if (re.test(b)) { if (id === "revenus" && !pos) continue; return id; }
  }
  return pos ? "entrees" : "autre";
}

function classify(txs, overrides) {
  for (const t of txs) {
    t.key = merchantKey(t.label);
    // Sur un compte d'épargne, tout est dépôt ou retrait d'épargne, sauf les intérêts versés.
    // Le profil est toujours consulté : même quand vous avez choisi la catégorie d'un nom,
    // une ligne de « Mon budget » qui le reconnaît doit être comptée (revenu déclaré, charge fixe).
    t.pf = null;
    const pfCat = state.profile ? profileCategory(t, state.profile) : null;
    t.cat = overrides[t.key + (t.amount > 0 ? "|+" : "|-")] || overrides[t.key] || pfCat || t.forceCat || (t.acct === "epargne" ? (t.amount > 0 && /\b(INTERETS?|INTEREST)\b/.test(norm(t.label)) ? "interets" : "epargne") : ruleCategory(t));
    // Un montant positif dans une catégorie de dépense = remboursement : il vient en déduction.
  }
}

/* ============================== Mon budget : revenus, charges fixes, crédits ============================== */
// Profil saisi par l'utilisateur, gardé dans ce navigateur. Chaque ligne peut être reconnue dans
// le relevé (« Nom dans le relevé ») et/ou avoir un montant mensuel saisi à la main, utilisé
// les mois où elle n'apparaît pas dans le relevé (salaire versé sur une autre banque, loyer payé ailleurs…).
const PROFILE_DEFAULT = { onlyDeclared: false, savingsNow: null, incomes: [], charges: [], credits: [] };
const newId = () => Math.random().toString(36).slice(2, 9);
function loadProfile() {
  const p = { ...PROFILE_DEFAULT, ...(store.get("profile", {}) || {}) };
  for (const k of ["incomes", "charges", "credits"]) p[k] = Array.isArray(p[k]) ? p[k].map(x => ({ id: x.id || newId(), ...x })) : [];
  return p;
}
const saveProfile = () => store.set("profile", state.profile);
// Déclare un payeur du relevé comme revenu (bouton « C'est un revenu » ou « Un revenu (salaire, aide…) »).
function addIncome(key) {
  if (!state.profile) state.profile = loadProfile();
  if (state.profile.incomes.some(x => norm(x.match) === norm(key))) return;
  state.profile.incomes.push({ id: newId(), label: key.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()), match: key, manual: null, end: "" });
  state.profile.onlyDeclared = true; saveProfile();
}
const hasWord = (txt, m) => !!m && (" " + txt + " ").includes(" " + norm(m) + " ");

// Classement par le profil : après vos choix explicites, avant les règles automatiques.
function profileCategory(t, P) {
  const txt = norm(t.type + " " + t.label);
  if (t.amount > 0) { const s = P.incomes.find(x => hasWord(txt, x.match)); if (s) { t.pf = s.id; return "revenus"; } return null; }
  const c = P.credits.find(x => hasWord(txt, x.match)); if (c) { t.pf = c.id; return "credit"; }
  const f = P.charges.find(x => hasWord(txt, x.match)); if (f) { t.pf = f.id; return f.cat || "foyer"; }
  return null;
}

const monthRange = (from, to) => { const out = []; const d = new Date(from.getFullYear(), from.getMonth(), 1); while (d <= to) { out.push(monthKey(d)); d.setMonth(d.getMonth() + 1); } return out; };
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
const monthName = k => { const [y, m] = k.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); };

// Ajoute les montants saisis à la main pour les mois où la ligne n'apparaît pas dans le relevé.
function applyProfile(res, txs, lvl) {
  const P = state.profile; if (!res.from) return;
  const months = monthRange(res.from, res.to);
  // Le montant saisi est une moyenne mensuelle : on complète la moyenne trouvée dans le relevé sur la
  // période, pas chaque mois séparément (un salaire versé le 30 ou le 1er tombe parfois deux fois dans
  // un même mois et zéro fois dans le suivant). Le complément est réparti à parts égales sur les mois.
  const tot = {}; for (const t of txs) if (t.pf) tot[t.pf] = (tot[t.pf] || 0) + Math.abs(t.amount);
  const det = {}, last = {}, byM = {};
  for (const t of txs) if (t.pf) {
    det[t.pf] = (det[t.pf] || 0) + Math.abs(t.amount); last[t.pf] = Math.max(last[t.pf] || 0, t.date);
    const m = byM[t.pf] || (byM[t.pf] = {}), k = monthKey(new Date(t.date)); m[k] = (m[k] || 0) + Math.abs(t.amount);
  }
  res.pf = { detected: det, manual: {}, last, byMonth: byM };
  const month = k => res.byMonth[k] || (res.byMonth[k] = { ess: 0, uti: 0, sup: 0, income: 0, savings: 0 });
  const addSpend = (cat, k, v) => {
    const C = res.byCat[cat] || (res.byCat[cat] = { id: cat, total: 0, count: 0, tx: [], merchants: {}, level: lvl(cat) });
    C.total += v; C.count++;
    const CM = res.byCatMonth[cat] || (res.byCatMonth[cat] = {}); CM[k] = (CM[k] || 0) + v;
    const l = lvl(cat); res.lv[l] += v; month(k)[l] += v; res.spend += v;
  };
  const note = (id, v) => { res.pf.manual[id] = (res.pf.manual[id] || 0) + v; };
  // Une ligne avec « Dernier mois » n'est complétée par le montant saisi que jusqu'à ce mois-là.
  const fill = (x, onMonth) => {
    const active = months.filter(k => !x.end || k <= x.end); if (!active.length) return;
    const extra = Math.max(0, x.manual * res.months * active.length / months.length - (tot[x.id] || 0)) / active.length;
    if (extra) for (const k of active) { onMonth(k, extra); note(x.id, extra); }
  };
  for (const s of P.incomes) if (s.manual > 0) fill(s, (k, v) => { month(k).income += v; res.income += v; });
  for (const c of P.charges) if (c.manual > 0) fill(c, (k, v) => addSpend(c.cat || "foyer", k, v));
  for (const c of P.credits) if (c.monthly > 0) {
    const active = months.filter(k => !c.end || k <= c.end);
    const extra = Math.max(0, c.monthly * res.months * active.length / months.length - (tot[c.id] || 0)) / (active.length || 1);
    for (const k of active) if (extra) { addSpend("credit", k, extra); note(c.id, extra); }
  }
  res.now = currentBudget(res);
}

// Budget d'aujourd'hui : la moyenne de la période, moins les revenus, charges et crédits terminés
// (une aide qui n'est plus versée ne doit plus compter dans le reste à vivre ni dans le plan d'épargne).
const isEnded = x => !!x.end && x.end < monthKey(new Date());
// Revenus nets du dernier mois : uniquement les revenus déclarés dans « Mon budget » (salaire, CAF…)
// encore actifs, tels qu'ils arrivent sur le compte. Chaque nouveau relevé fait avancer le mois.
// Un mois où un revenu tombe deux fois (versement en avance) est ramené à sa médiane. Le « mois type
// aujourd'hui » part des mêmes montants, pour que les deux chiffres concordent.
function incomeNow(x, pf) {
  const bm = ((pf && pf.byMonth) || {})[x.id] || {}, keys = Object.keys(bm).sort(), vals = keys.map(k => bm[k]);
  if (!keys.length && !(x.manual > 0)) return null;
  const k = keys[keys.length - 1] || "";
  let v = x.manual > 0 ? x.manual : bm[k];
  if (!(x.manual > 0) && vals.length >= 3 && v > 1.5 * median(vals)) v = median(vals);
  return { v, month: k };
}
function refIncome(r) {
  const P = state.profile, pf = r.pf; if (!P || !pf || !P.incomes.length) return null;
  let month = "", total = 0; const parts = [];
  for (const x of P.incomes) {
    if (isEnded(x)) continue;
    const n = incomeNow(x, pf); if (!n) continue;
    if (n.month > month) month = n.month;
    parts.push({ label: x.label || "Revenu", v: n.v }); total += n.v;
  }
  return parts.length ? { total, month, parts } : null;
}

function currentBudget(res) {
  const P = state.profile, mo = res.months, pf = res.pf || { detected: {}, manual: {}, byMonth: {} };
  const avg = x => ((pf.detected[x.id] || 0) + (pf.manual[x.id] || 0)) / mo;
  const endedIn = P.incomes.filter(isEnded).map(x => ({ x, v: avg(x) })).filter(e => e.v > 0);
  const endedOut = [...P.charges, ...P.credits].filter(isEnded).map(x => ({ x, v: avg(x) })).filter(e => e.v > 0);
  const typical = [];
  for (const x of P.incomes) {
    if (isEnded(x)) continue;
    const n = incomeNow(x, pf), t = n ? n.v : 0;
    if (t > 0 && Math.abs(t - avg(x)) > Math.max(20, 0.03 * t)) typical.push({ x, v: t, avg: avg(x) });
  }
  const inc = res.income / mo - endedIn.reduce((a, e) => a + e.v, 0) + typical.reduce((a, e) => a + e.v - e.avg, 0);
  const spend = res.spend / mo - endedOut.reduce((a, e) => a + e.v, 0);
  return { inc: Math.max(0, inc), spend: Math.max(0, spend), endedIn, endedOut, typical, changed: endedIn.length + endedOut.length + typical.length > 0 };
}

// Taux et plafonds officiels au 1er août 2026 (Livret A, LDDS, LEP) et fiscalité 2026.
const RATES_DATE = "1er août 2026";
const RATES = { livretA: 1.7, ldds: 1.7, lep: 2.5, plafondA: 22950, plafondLdds: 12000, plafondLep: 10000, lepRfr: 22823, revolut: 2.25, pfu: 31.4, psPea: 18.6 };

function placementPlan(r) {
  const P = state.profile, mo = r.months;
  const N = r.now || { inc: r.income / mo, spend: r.spend / mo };
  const inc = N.inc, spend = N.spend, surplus = inc - spend, ess = r.lv.ess / mo;
  const out = [];
  const step = (tone, title, html) => out.push({ tone, title, html });
  const cushionLow = Math.round(ess * 300) / 100, cushionHigh = Math.round(ess * 600) / 100;
  const now = P.savingsNow;
  // Crédits : ce qu'il reste et l'argent libéré ensuite
  const today = r.to;
  for (const c of P.credits) {
    if (!(c.monthly > 0) || !c.end) continue;
    const [y, m] = c.end.split("-").map(Number), end = new Date(y, m - 1, 1);
    const left = Math.max(0, monthsBetween(today, end) + (today.getDate() < 28 ? 1 : 0));
    if (left > 0) step("info", `${c.label || "Crédit"} : ${left} mensualité${left > 1 ? "s" : ""} restante${left > 1 ? "s" : ""}`, `Reste environ <b>${eur.format(left * c.monthly)}</b> à rembourser, jusqu'en ${monthName(c.end)}. Ensuite, <b>${eur.format(c.monthly)} par mois</b> se libèrent : programmez dès maintenant un virement de ce montant vers votre épargne pour le mois suivant la dernière échéance, pour que l'argent ne se dilue pas dans les dépenses. Un remboursement anticipé peut coûter moins cher que les intérêts restants : vérifiez les indemnités prévues dans votre contrat.`);
    else step("good", `${c.label || "Crédit"} terminé`, `La dernière échéance est passée : ${eur.format(c.monthly)} par mois sont désormais disponibles. S'ils ne partent pas déjà vers l'épargne, programmez un virement automatique de ce montant.`);
  }
  if (inc <= 0) { step("warn", "Revenus inconnus", "Indiquez vos revenus dans la section Revenus ci-dessus (ou importez le relevé où ils arrivent) pour obtenir un plan."); return { out, surplus, ess, cushionLow, cushionHigh }; }
  if (surplus <= 0) {
    step("crit", "D'abord dégager un surplus", `${r.now && r.now.changed ? "Pour un mois type aujourd'hui" : "Sur la période"}, vos dépenses (${eur.format(spend)} par mois) atteignent ou dépassent vos revenus (${eur.format(inc)}). Avant tout placement, l'objectif est de réduire les postes superflus : voir l'onglet Conseils. Placer de l'argent dont on aura besoin le mois suivant expose à des frais de découvert plus élevés que n'importe quel rendement.`);
    return { out, surplus, ess, cushionLow, cushionHigh };
  }
  // 1. Épargne de précaution
  const lep = `<b>LEP ${fmtPct(RATES.lep)}</b>, le mieux rémunéré, si votre revenu fiscal de référence est inférieur à ${eur.format(RATES.lepRfr)} pour une part (voir votre avis d'imposition ; plafond ${eur.format(RATES.plafondLep)})`;
  const livrets = `${lep}, puis <b>Livret A et LDDS à ${fmtPct(RATES.livretA)}</b>, nets d'impôt, disponibles à tout moment (plafonds ${eur.format(RATES.plafondA)} et ${eur.format(RATES.plafondLdds)}). Le compte d'épargne Revolut à ${fmtPct(RATES.revolut)} brut rapporte environ ${fmtPct(Math.round(RATES.revolut * (1 - RATES.pfu / 100) * 100) / 100)} après le prélèvement forfaitaire de ${fmtPct(RATES.pfu)} : moins qu'un Livret A pour la même disponibilité`;
  if (now == null || now < cushionLow) {
    const gap = Math.max(0, cushionLow - (now || 0));
    const monthsTo = gap ? Math.ceil(gap / surplus) : 0;
    step("warn", "1. Constituer une épargne de précaution", `Objectif : 3 à 6 mois de dépenses essentielles, soit <b>${eur.format(cushionLow)} à ${eur.format(cushionHigh)}</b> (vos dépenses essentielles : ${eur.format(ess)} par mois). ${now == null ? "Indiquez ci-dessus votre épargne disponible aujourd'hui pour savoir où vous en êtes." : `Vous avez ${eur.format(now)} : il manque ${eur.format(gap)}.`} Avec votre surplus actuel de ${eur.format(surplus)} par mois${monthsTo ? `, l'objectif est atteint en environ ${monthsTo} mois` : ""}. Où la placer : ${livrets}.`);
  } else step("good", "1. Épargne de précaution en place", `Vous avez ${eur.format(now)}, pour un objectif de ${eur.format(cushionLow)} à ${eur.format(cushionHigh)}. Gardez-la sur des livrets disponibles : ${livrets}.`);
  // 2. Long terme
  const reached = now != null && now >= cushionLow;
  step(reached ? "info" : "good", reached ? "2. Investir pour le long terme (5 ans et plus)" : "2. Ensuite : investir pour le long terme (5 ans et plus)", `Une fois la précaution en place, l'argent dont vous n'aurez pas besoin avant plusieurs années peut viser plus que les livrets, en acceptant des variations : <b>PEA</b> avec un fonds indiciel (ETF) « monde » diversifié, alimenté chaque mois du même montant pour lisser les hausses et les baisses ; après 5 ans, seuls les prélèvements sociaux (${fmtPct(RATES.psPea)}) s'appliquent aux gains. <b>Assurance-vie</b> (fonds en euros garanti et unités de compte) : après 8 ans, abattement annuel de 4 600 € sur les gains retirés (9 200 € pour un couple). Exemple avec votre surplus de ${eur.format(surplus)} : une fois la précaution atteinte, ${eur.format(surplus * 0.5)} par mois sur un PEA et ${eur.format(surplus * 0.3)} sur une assurance-vie, le reste en livret pour les projets proches.`);
  // 3. Placements risqués repérés dans le relevé
  const risky = [...new Set(state.tx.filter(t => /\b(ETORO|AVATRADE|KUCOIN|BINANCE|COINBASE|KRAKEN|BITPANDA|CRYPTO|DIGITAL ASSETS|PLUS500|XTB|IG MARKETS)\b/.test(norm(t.label))).map(t => t.key.toLowerCase()))];
  if (risky.length) step("warn", "Trading et crypto : prudence", `Votre relevé contient des opérations vers ${risky.slice(0, 4).map(esc).join(", ")}. Les CFD et le trading à effet de levier font perdre de l'argent à la majorité des particuliers (les courtiers doivent afficher ce pourcentage), et les cryptomonnaies peuvent perdre une grande partie de leur valeur en peu de temps. Si vous y tenez, limitez-les à une petite part de votre épargne, jamais à l'épargne de précaution.`);
  return { out, surplus, ess, cushionLow, cushionHigh };
}

/* ============================== Analyse ============================== */
function analyse(txs, levels) {
  const lvl = id => levels[id] || CAT[id].level;
  const res = { byCat: {}, byMonth: {}, byCatMonth: {}, income: 0, spend: 0, savings: 0, lv: { ess: 0, uti: 0, sup: 0 }, txs };
  if (!txs.length) return res;
  const min = Math.min(...txs.map(t => t.date)), max = Math.max(...txs.map(t => t.date));
  res.days = Math.round((max - min) / 864e5) + 1;
  res.months = Math.max(res.days / 30.44, 0.25);
  res.from = new Date(min); res.to = new Date(max);
  // Compte d'épargne importé : ses dépôts et retraits font foi. Les virements « vers l'épargne »
  // du compte courant sur la même période sont les mêmes mouvements vus de l'autre côté : ignorés.
  const savTx = txs.filter(t => t.acct === "epargne");
  const S = savTx.length ? { dep: 0, wd: 0, interest: 0, from: new Date(Math.min(...savTx.map(t => t.date))), to: new Date(Math.max(...savTx.map(t => t.date))), firstDep: null, lastWd: null } : null;
  res.sav = S; res.onlySavings = savTx.length === txs.length;
  // Un virement du compte courant vers l'épargne apparaît aussi, en sens inverse, sur le compte
  // d'épargne importé : on ne le compte qu'une fois (même montant, à 3 jours près).
  const mirror = {};
  for (const t of savTx) if ((CAT[t.cat] || {}).kind === "savings") (mirror[(-t.amount).toFixed(2)] = mirror[(-t.amount).toFixed(2)] || []).push(t.date);
  const isMirrored = t => {
    const L = mirror[t.amount.toFixed(2)]; if (!L) return false;
    const i = L.findIndex(d => Math.abs(d - t.date) <= 3 * 864e5); if (i < 0) return false;
    L.splice(i, 1); return true;
  };
  for (const t of txs) {
    const c = CAT[t.cat] || CAT.autre;
    const mk = new Date(t.date); const k = mk.getFullYear() + "-" + String(mk.getMonth() + 1).padStart(2, "0");
    const M = res.byMonth[k] || (res.byMonth[k] = { ess: 0, uti: 0, sup: 0, income: 0, savings: 0 });
    if (c.kind === "internal") continue;
    if (c.kind === "pro") { res.pro = (res.pro || 0) - t.amount; continue; }
    if (c.kind === "savings") {
      let v;
      if (t.acct === "epargne") {
        v = t.amount;
        if (v > 0) { S.dep += v; if (!S.firstDep || t.date < S.firstDep) S.firstDep = t.date; }
        else { S.wd -= v; if (!S.lastWd || t.date > S.lastWd) S.lastWd = t.date; }
      } else {
        if (isMirrored(t)) continue;
        v = -t.amount;
      }
      res.savings += v; M.savings += v; continue;
    }
    if (c.kind === "income" && state.profile.onlyDeclared && state.profile.incomes.length && !t.pf && t.cat !== "interets") { res.otherIn = (res.otherIn || 0) + t.amount; continue; }
    if (c.kind === "income") { res.income += t.amount; M.income += t.amount; if (S && t.cat === "interets") S.interest += t.amount; continue; }
    const spent = -t.amount; // remboursement = dépense négative
    const C = res.byCat[t.cat] || (res.byCat[t.cat] = { id: t.cat, total: 0, count: 0, tx: [], merchants: {} });
    C.total += spent; if (spent > 0) C.count++; C.tx.push(t);
    C.merchants[t.key] = (C.merchants[t.key] || 0) + spent;
    const CM = res.byCatMonth[t.cat] || (res.byCatMonth[t.cat] = {}); CM[k] = (CM[k] || 0) + spent;
    const l = lvl(t.cat); res.lv[l] += spent; M[l] += spent; res.spend += spent;
  }
  applyProfile(res, txs, lvl);
  for (const C of Object.values(res.byCat)) { C.level = lvl(C.id); C.monthly = C.total / res.months; }
  res.recurring = detectRecurring(txs);
  res.advice = buildAdvice(res, txs, lvl);
  return res;
}

function detectRecurring(txs) {
  const groups = {};
  for (const t of txs) {
    const c = CAT[t.cat];
    if (t.amount >= 0 || !c || c.kind || ["courses", "restaurants", "transport", "especes", "shopping", "livraison", "autre"].includes(t.cat) && !/PRLV|PRELEVEMENT/.test(norm(t.label))) continue;
    (groups[t.key] || (groups[t.key] = [])).push(t);
  }
  const out = [];
  for (const [key, list] of Object.entries(groups)) {
    if (list.length < 2) continue;
    list.sort((a, b) => a.date - b.date);
    const months = new Set(list.map(t => new Date(t.date).getFullYear() * 12 + new Date(t.date).getMonth()));
    const gaps = list.slice(1).map((t, i) => (t.date - list[i].date) / 864e5);
    const g = median(gaps);
    const amts = list.map(t => -t.amount);
    const m = median(amts);
    const spread = Math.max(...amts) / Math.max(0.01, Math.min(...amts));
    let period = null;
    if (g >= 25 && g <= 35 && months.size >= 2) period = "mensuel";
    else if (g >= 5 && g <= 9 && list.length >= 3) period = "hebdo";
    else if (g >= 80 && g <= 100) period = "trimestriel";
    else if (g >= 350 && g <= 380) period = "annuel";
    if (!period || spread > 1.35) continue;
    const perMonth = m * 30.44 / g;
    out.push({ key, cat: list[0].cat, label: list[list.length - 1].label, amount: m, period, perMonth, perYear: perMonth * 12, count: list.length, last: list[list.length - 1].date });
  }
  return out.sort((a, b) => b.perYear - a.perYear);
}

function buildAdvice(r, txs, lvl) {
  const A = [], mo = r.months;
  const monthly = id => (r.byCat[id] ? r.byCat[id].total / mo : 0);
  const N = r.now || { inc: r.income / mo, spend: r.spend / mo, changed: false };
  const inc = N.inc, spend = N.spend, per = N.changed ? "Pour un mois type aujourd'hui" : "Sur la période";
  const covered = new Set();
  const add = (tone, title, text, saving, cat, pin, src) => { if (cat && saving > 0) covered.add(cat); A.push({ tone, title, text, src: src || "", pin: !!pin, saving: Math.max(0, Math.round(saving || 0)) }); };
  savingsAdvice(r, add);
  if (r.onlySavings) return A;
  for (const { x, v } of N.endedIn || []) add("info", `${x.label || "Revenu"} : dernier versement en ${monthName(x.end)}`, `Ce revenu apportait en moyenne ${eur.format(v)} par mois sur la période. Sans lui, vos revenus sont d'environ <b>${eur.format(inc)}</b> par mois pour ${eur.format(spend)} de dépenses, soit ${inc - spend < 0 ? `un manque de <b>${eur.format(spend - inc)}</b>` : `un reste de <b>${eur.format(inc - spend)}</b>`} par mois. Les conseils ci-dessous et le plan de « Mon budget » tiennent compte de ce changement. Si la fin n'était pas prévue, vérifiez sur votre espace en ligne s'il manque un justificatif ou une déclaration trimestrielle : un droit suspendu peut parfois être rétabli.`, 0, null, true);

  if (inc > 0) {
    const rate = (inc - spend) / inc;
    if (rate < 0) add("crit", "Vous dépensez plus que vous ne gagnez", `${per}, vos dépenses dépassent vos revenus de ${eur.format(spend - inc)} par mois. Commencez par les postes « Superflu » ci-dessous : ce sont les plus faciles à réduire sans toucher à l'essentiel.`, 0, null, true);
    else if (rate < 0.1) add("warn", "Votre marge est faible", `Il vous reste environ ${pct(rate)} de vos revenus en fin de mois (${eur.format(inc - spend)}). Viser 10 à 20 % permet d'absorber un imprévu sans découvert.`, 0, null, true);
    else if (rate >= 0.2) add("good", "Bonne capacité d'épargne", `Il vous reste environ ${pct(rate)} de vos revenus chaque mois (${eur.format(inc - spend)}). Si ce n'est pas déjà fait, programmez un virement automatique vers un livret le jour de la paie.`, 0, null, true);
    const envies = (r.lv.uti + r.lv.sup) / mo;
    if (envies / inc > 0.3) add("warn", "Les envies dépassent 30 % de vos revenus", `La règle 50/30/20 conseille de garder les dépenses non essentielles sous 30 % des revenus. Vous êtes à ${pct(envies / inc)}. Revenir à 30 % libérerait ${eur.format(envies - 0.3 * inc)} par mois : les pistes ci-dessous y contribuent.`, 0, null, true);
    if (r.lv.ess / mo / inc > 0.6) add("info", "Vos charges essentielles sont lourdes", `L'essentiel représente ${pct(r.lv.ess / mo / inc)} de vos revenus (cible : 50 %). Les postes renégociables sont les assurances, l'énergie et le forfait téléphone.`, 0);
  } else {
    add("info", "Aucun revenu détecté", "Le relevé ne contient pas d'entrée d'argent reconnue. Les comparaisons avec vos revenus sont désactivées. Si votre salaire arrive sur un autre compte, importez plutôt ce compte-là.", 0);
  }

  const liv = monthly("livraison");
  if (liv > 25) add("warn", "Livraison de repas", `${eur.format(liv)} par mois en livraison (${r.byCat.livraison.count} commandes sur la période). Les frais de service et de livraison ajoutent souvent 20 à 30 % au prix. Cuisiner une commande sur deux économiserait environ ${eur.format(liv / 2)} par mois.`, liv / 2 * 12, "livraison");
  const rest = monthly("restaurants");
  if (rest > 80) add("warn", "Restaurants et cafés", `${eur.format(rest)} par mois, soit ${r.byCat.restaurants.count} passages sur la période. Préparer son déjeuner deux jours par semaine réduit ce poste d'environ 30 %.`, rest * 0.3 * 12, "restaurants");

  const subs = r.recurring.filter(s => s.cat === "abonnements");
  const streams = subs.filter(s => STREAMING.test(norm(s.label)) && !MUSIC.test(norm(s.label)));
  const musics = subs.filter(s => MUSIC.test(norm(s.label)));
  if (streams.length >= 2) {
    const sorted = [...streams].sort((a, b) => b.perMonth - a.perMonth);
    const save = sorted.slice(1).reduce((a, s) => a + s.perMonth, 0);
    add("warn", `${streams.length} services de streaming vidéo`, `${sorted.map(s => s.key.toLowerCase()).join(", ")} : ${eur2.format(streams.reduce((a, s) => a + s.perMonth, 0))} par mois. En gardant un seul service à la fois et en alternant selon les séries du moment, vous économisez environ ${eur2.format(save)} par mois.`, save * 12, "abonnements");
  }
  if (musics.length >= 2) {
    const sorted = [...musics].sort((a, b) => b.perMonth - a.perMonth);
    const save = sorted.slice(1).reduce((a, s) => a + s.perMonth, 0);
    add("warn", "Plusieurs abonnements musicaux", `${sorted.map(s => s.key.toLowerCase()).join(" et ")} font doublon. En garder un seul : ${eur2.format(save)} par mois économisés.`, save * 12);
  }
  if (subs.length) {
    const tot = subs.reduce((a, s) => a + s.perYear, 0);
    add("info", "Faites le tri dans vos abonnements", `${subs.length} abonnement${subs.length > 1 ? "s" : ""} numérique${subs.length > 1 ? "s" : ""} détecté${subs.length > 1 ? "s" : ""}, soit ${eur.format(tot)} par an. Pour chacun, demandez-vous si vous l'avez utilisé le mois dernier. Voir l'onglet Abonnements.`, 0);
  }

  const frais = r.byCat.frais ? r.byCat.frais.total : 0;
  if (frais > 0) add("warn", "Frais bancaires évitables", `${eur2.format(frais)} de frais sur la période (${eur.format(frais / mo * 12)} par an au rythme actuel). Vérifiez les conditions de gratuité de votre carte (paiement minimum par mois, offre choisie) et les commissions d'intervention liées aux découverts. Un courrier à la banque suffit parfois à obtenir un remboursement.`, frais / mo * 12);

  const jeux = monthly("jeux");
  if (jeux > 0) add("warn", "Jeux d'argent", `${eur.format(jeux)} par mois en jeux et paris. Fixer un plafond mensuel dans l'appli de jeu aide à garder le contrôle. En cas de besoin, Joueurs Info Service répond au 09 74 75 13 13 (appel non surtaxé).`, jeux * 12, "jeux");
  const jv = monthly("jeuxvideo");
  if (jv > 15) add("warn", "Jeux vidéo et achats in-app", `${eur.format(jv)} par mois, en ${r.byCat.jeuxvideo.count} achats sur la période (applis, jeux, monnaie virtuelle). Ces petits achats passent inaperçus un par un. Désactivez les achats intégrés ou fixez un budget mensuel dans Google Play : les réduire de moitié libère ${eur.format(jv / 2)} par mois.`, jv / 2 * 12, "jeuxvideo");
  const tabac = monthly("tabac");
  if (tabac > 0) add("info", "Tabac", `${eur.format(tabac)} par mois, soit ${eur.format(tabac * 12)} par an. Tabac Info Service (39 89) propose un accompagnement gratuit à l'arrêt, et les substituts nicotiniques sont remboursés par l'Assurance maladie.`, tabac * 12 * 0.5, "tabac");

  const shop = monthly("shopping");
  if (shop > 120) add("warn", "Shopping et achats en ligne", `${eur.format(shop)} par mois. Essayez la règle des 48 heures : mettez l'article au panier et attendez deux jours avant de valider. Une partie des achats d'impulsion disparaît d'elle-même, souvent un quart.`, shop * 0.25 * 12, "shopping");

  const small = txs.filter(t => t.amount < 0 && t.amount > -15 && lvl(t.cat) === "sup" && !CAT[t.cat].kind && !covered.has(t.cat));
  const smallPerMonth = small.length / mo;
  if (smallPerMonth >= 10) {
    const tot = -small.reduce((a, t) => a + t.amount, 0) / mo;
    add("info", "Les petites dépenses s'additionnent", `${Math.round(smallPerMonth)} achats de moins de 15 € par mois classés « Superflu » (hors postes déjà cités), pour ${eur.format(tot)} au total. Pris un par un ils semblent anodins ; en diviser le nombre par deux représente ${eur.format(tot * 6)} par an.`, tot * 6);
  }

  const tel = monthly("telecom");
  if (tel > 45) add("info", "Forfaits téléphone et internet", `${eur.format(tel)} par mois. Des forfaits mobiles sans engagement existent autour de 10 € et une box internet autour de 25 €. Comparez avant la fin d'une promotion : les prix remontent souvent après 12 mois.`, Math.max(0, tel - 35) * 12);
  const ass = monthly("assurances");
  if (ass > 150) add("info", "Assurances et mutuelle", `${eur.format(ass)} par mois. Après un an de contrat, les assurances auto, habitation et la complémentaire santé se résilient à tout moment : faites jouer la concurrence une fois par an.`, ass * 0.1 * 12);

  const cash = r.byCat.especes ? r.byCat.especes.total : 0;
  if (r.spend > 0 && cash / r.spend > 0.12) add("info", "Beaucoup de retraits d'espèces", `${pct(cash / r.spend)} de vos dépenses passent en espèces (${eur.format(cash / mo)} par mois). Ces montants échappent à l'analyse : notez à quoi ils servent pendant un mois pour voir s'ils cachent des dépenses superflues.`, 0);

  const unk = r.byCat.autre ? r.byCat.autre.total : 0;
  if (r.spend > 0 && unk / r.spend > 0.1) add("info", "Des opérations restent à classer", `${eur.format(unk)} de dépenses n'ont pas été reconnues automatiquement. Classez-les dans l'onglet Opérations : l'appli retiendra le commerçant pour les prochains relevés.`, 0);

  // Mois complets seulement : un mois en cours ferait croire à une baisse.
  const months = Object.keys(r.byMonth).sort();
  if (months.length && r.to.getDate() < new Date(r.to.getFullYear(), r.to.getMonth() + 1, 0).getDate() - 2) months.pop();
  if (months.length >= 3) {
    const last = months[months.length - 1], prev = months.slice(0, -1);
    const avgSup = prev.reduce((a, k) => a + r.byMonth[k].sup, 0) / prev.length;
    const lastSup = r.byMonth[last].sup;
    if (avgSup > 0 && lastSup < avgSup * 0.85) add("good", "Le superflu recule", `En ${monthLabel(last)}, vos dépenses superflues (${eur.format(lastSup)}) sont inférieures de ${pct(1 - lastSup / avgSup)} à la moyenne des mois précédents. Continuez.`, 0);
  }

  revolutAdvice(r, txs, add);
  const order = { crit: 0, warn: 1, info: 2, good: 3 };
  return A.sort((a, b) => b.pin - a.pin || order[a.tone] - order[b.tone] || b.saving - a.saving);
}

const fmtPct = v => v.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " %";
function savingsMeta() {
  const list = Object.values(state.metas || {}).filter(m => m.acct === "epargne");
  return list.sort((a, b) => b.at - a.at)[0] || null;
}
function savingsAdvice(r, add) {
  const s = r.sav; if (!s) return;
  const m = savingsMeta() || {};
  const kept = s.firstDep && s.lastWd ? Math.max(1, Math.round((s.lastWd - s.firstDep) / 864e5)) : 0;
  if (s.dep > 0 && s.wd >= s.dep * 0.9 && kept > 60) {
    add("warn", "Votre épargne ne grossit pas", `Sur la période, ${eur.format(s.dep)} ont été mis de côté (Pockets et compte d'épargne) et ${eur.format(s.wd)} en ont été retirés. L'épargne sert de réserve, c'est normal d'y puiser ; pour qu'elle progresse, programmez un virement automatique le jour de la paie et gardez une Pocket « réserve » à laquelle vous ne touchez pas.`, 0, null, true);
  } else if (s.dep > 0 && s.wd >= s.dep * 0.9 && kept) {
    add("warn", "L'épargne a été retirée rapidement", `${eur2.format(s.dep)} déposés puis ${eur2.format(s.wd)} retirés : l'argent est resté environ ${kept} jour${kept > 1 ? "s" : ""} sur le compte${s.interest > 0 ? ` et a rapporté ${eur2.format(s.interest)} d'intérêts` : ""}. Les intérêts sont calculés sur le solde de chaque jour : plus l'argent reste longtemps, plus il rapporte. Un virement automatique chaque mois, même de 20 €, aide à laisser l'épargne grandir.`, 0, null, true);
  } else if (s.dep > s.wd) {
    add("good", "Votre épargne progresse", `${eur2.format(s.dep - s.wd)} mis de côté sur la période (${eur2.format(s.dep)} déposés, ${eur2.format(s.wd)} retirés)${s.interest > 0 ? `, plus ${eur2.format(s.interest)} d'intérêts` : ""}. Continuez avec un virement automatique le jour de la paie.`, 0, null, true);
  }
  if (m.rate && (s.dep > 0 || m.close > 0)) {
    const base = Math.max(s.dep, m.close || 0);
    const gross = base * m.rate / 100, net = m.pfu ? gross * (1 - m.pfu / 100) : null;
    add("info", "Ce que votre épargne peut rapporter", `Au taux de ${fmtPct(m.rate)} brut par an indiqué sur le relevé, ${eur.format(base)} laissés un an entier rapportent environ ${eur2.format(gross)} brut${net != null ? `, soit ${eur2.format(net)} net après le prélèvement de ${fmtPct(m.pfu)} mentionné par la banque` : " avant impôts"}. Chaque tranche de 100 € laissée un an ajoute environ ${eur2.format(m.rate)} brut.`, 0);
  }
  if (s.interest > 0 && m.taxWithheld === 0) add("info", "Intérêts versés sans impôt retenu", `Le relevé indique 0,00 € d'impôt et de prélèvements sociaux retenus sur ${eur2.format(s.interest)} d'intérêts. Vérifiez comment ces intérêts doivent apparaître dans votre déclaration de revenus.`, 0);
}

// Offres Revolut France relevées au 9 juillet 2026 (prix mensuels, retraits gratuits par mois glissant).
// À mettre à jour si Revolut change ses tarifs : les conseils le rappellent au lecteur.
const REVOLUT_DATE = "9 juillet 2026";
const REVOLUT_PLANS = {
  standard: { name: "Standard", price: 0, atm: 200 },
  plus: { name: "Plus", price: 3.99, atm: 200 },
  premium: { name: "Premium", price: 10.99, atm: 400 },
  metal: { name: "Metal", price: 18.99, atm: 800 },
  ultra: { name: "Ultra", price: 60, atm: 2000 }
};
function revolutAdvice(r, txs, add) {
  const isRev = txs.some(t => t.bank === "revolut") || !!state.metas._revolut;
  if (!isRev || r.onlySavings) return;
  const A = (tone, title, text, saving, cat) => add(tone, title, text, saving, cat, false, "Revolut");
  const note = `Offres Revolut France au ${REVOLUT_DATE} : vérifiez dans l'appli avant de changer.`;

  // Retraits : mois le plus chargé de la période
  const atm = {};
  for (const t of txs) if (t.cat === "especes" && t.amount < 0) {
    const k = monthKey(new Date(t.date)); const m = atm[k] || (atm[k] = { sum: 0, n: 0 }); m.sum -= t.amount; m.n++;
  }
  const months = Object.values(atm), maxSum = Math.max(0, ...months.map(m => m.sum)), maxN = Math.max(0, ...months.map(m => m.n));
  const fits = p => maxSum <= REVOLUT_PLANS[p].atm && (p !== "standard" || maxN <= 5);
  const cheapest = ["standard", "plus", "premium", "metal", "ultra"].find(fits) || "ultra";

  const cur = state.metas._revolut, plan = cur && REVOLUT_PLANS[cur.plan];
  const planFees = txs.filter(t => /ABONNEMENT (STANDARD|PLUS|PREMIUM|METAL|ULTRA)/.test(norm(t.label)) && t.amount < 0);
  const paidYear = -planFees.reduce((a, t) => a + t.amount, 0) / r.months * 12;
  if (plan && cur.plan !== "standard") {
    const alt = REVOLUT_PLANS[cheapest];
    const altCost = alt.price * 12;
    const fullCost = plan.price * 12;
    const atmTxt = months.length ? `Vos retraits d'espèces sur la période : au plus ${eur.format(maxSum)} et ${maxN} retrait${maxN > 1 ? "s" : ""} dans un même mois, ce que couvre déjà le forfait ${alt.name} (${alt.atm} € de retraits gratuits par mois${cheapest === "standard" ? ", 5 retraits au plus" : ""}).` : "Aucun retrait d'espèces sur la période.";
    if (cur.amount === 0) {
      A("info", `Forfait ${plan.name} actuellement gratuit`, `Votre dernier relevé indique 0,00 € pour l'abonnement ${plan.name} : il ne vous est pas facturé en ce moment. Au tarif affiché, il coûterait ${eur2.format(plan.price)} par mois, soit ${eur.format(fullCost)} par an. ${atmTxt} Le compte d'épargne rapporte 2,25 % quel que soit le forfait, sauf Ultra. Vérifiez dans l'appli jusqu'à quand dure cette gratuité : quand elle prendra fin, passer en ${alt.name} éviterait environ ${eur.format(fullCost - altCost)} par an. ${note}`, 0);
    } else {
      const yearly = paidYear || cur.amount * 12;
      if (yearly > altCost + 1) A("warn", `Forfait ${plan.name} : ${eur.format(yearly)} par an`, `${atmTxt} Le compte d'épargne rapporte 2,25 % quel que soit le forfait, sauf Ultra. Si vous n'utilisez pas les assurances ni les autres services inclus dans ${plan.name}, passer en ${alt.name} économiserait environ ${eur.format(yearly - altCost)} par an. ${note}`, 0);
    }
  }

  // Frais de retrait payés
  const atmFeeSum = -txs.filter(t => t.forceCat === "frais" && /RETRAIT|ESPECES|DAB|ATM/.test(norm(t.label))).reduce((a, t) => a + t.amount, 0);
  if (atmFeeSum > 0) A("warn", "Frais de retrait d'espèces", `${eur2.format(atmFeeSum)} de frais de retrait sur la période. Revolut facture 2 % (1 € minimum) au-delà des retraits gratuits de votre forfait (200 € par mois en Standard et Plus, 400 € en Premium, 800 € en Metal). Retirer une seule fois un montant plus élevé, ou payer par carte, évite ces frais. ${note}`, 0);

  // Arrondis vers un coffre
  const card = txs.filter(t => t.amount < 0 && /CARTE|CARD/.test(norm(t.type)) && !CAT[t.cat].kind);
  const round = card.reduce((a, t) => a + (Math.ceil(-t.amount - 1e-9) + t.amount), 0);
  if (card.length >= 20 && round > 0) A("good", "Épargner avec les arrondis Revolut", `Avec les arrondis, chaque paiement par carte est arrondi à l'euro supérieur et la différence part dans un coffre d'épargne. Sur vos ${card.length} paiements par carte de la période, cela aurait mis de côté ${eur.format(round)}, soit environ ${eur.format(round / r.months * 12)} par an, sans y penser. À activer dans l'appli, sur un coffre ou le compte d'épargne à 2,25 %.`, 0);

  // Virement programmé vers un coffre
  const inc = r.now ? r.now.inc : r.income / r.months, spend = r.now ? r.now.spend : r.spend / r.months;
  if (inc > 0 && (inc - spend) / inc < 0.1) A("info", "Virement programmé vers un coffre", `Revolut permet de programmer un virement automatique vers un coffre ou le compte d'épargne le jour où arrive votre revenu. Même 20 € par mois font 240 € par an, rémunérés à 2,25 %, avant que l'argent ne soit dépensé.`, 0);

  // Blocage des jeux d'argent
  if (r.byCat.jeux && r.byCat.jeux.total > 0) A("info", "Blocage des jeux d'argent", `Revolut peut refuser automatiquement les paiements vers les casinos, paris sportifs et loteries (Profil > Sécurité > Blocage des jeux d'argent). Pour le désactiver, il faut attendre 48 heures, ce qui aide à tenir un plafond. Vous y avez consacré ${eur.format(r.byCat.jeux.total / r.months)} par mois sur la période.`, 0);
}

const state = {
  tab: store.get("tab", "accueil"), moves: store.get("moves", "out"), outBy: store.get("outBy", "cat"), month: null,
  overrides: store.get("overrides", {}),
  levels: store.get("levels", {}),
  budgets: store.get("budgets", {}), budgetMonth: null, profile: null,
  metas: store.get("metas", {}), histBefore: [], fileAcct: "", lastImport: null, infoNote: "", period: store.get("period", null),
  tx: [], file: null, sample: false, rows: null, headerIdx: -1, map: {}, invert: false,
  search: "", showAll: false, openCat: null, catFilter: "", signFilter: "", res: null,
  flow: store.get("flow", "in"), openFlow: null
};

// Période analysée : mois complets jusqu'au dernier mois du relevé.
function periodTx() {
  const tx = state.tx; if (!tx.length) return tx;
  const last = new Date(Math.max(...tx.map(t => t.date))), first = Math.min(...tx.map(t => t.date));
  const spanMonths = (last - first) / (30.44 * 864e5);
  state.periodAvail = spanMonths >= 4; state.periodDefault = spanMonths > 13 ? "12" : "all";
  const p = state.period || state.periodDefault;
  if (p === "all" || spanMonths < 4) return tx;
  const cut = new Date(last.getFullYear(), last.getMonth() - (+p - 1), 1).getTime();
  return tx.filter(t => t.date >= cut);
}
function recompute() {
  if (!state.profile) state.profile = loadProfile();
  classify(state.tx, state.overrides);
  state.res = analyse(periodTx(), state.levels);
  render();
}


function loadText(text, name, isSample) {
  const delim = detectDelimiter(text);
  const rows = parseCSV(text, delim);
  if (rows.length < 2) { setStatus("Ce fichier ne contient pas de lignes lisibles. Vérifiez qu'il s'agit bien d'un export CSV de vos opérations.", "crit"); return; }
  const headerIdx = findHeaderRow(rows);
  const map = guessMapping(rows, headerIdx);
  Object.assign(state, { rows, headerIdx, map, file: name, fileBank: "", sample: !!isSample, invert: false, showAll: false, openCat: null, catFilter: "", pdfNote: "", infoNote: "",
    fileAcct: /savings|epargne|épargne|livret/i.test(name) ? "epargne" : "", histBefore: isSample ? [] : store.get("history", []) });
  applyMapping();
}

function applyMapping() {
  const { rows, headerIdx, map, invert } = state;
  state.month = null; state.budgetMonth = null;
  renderMapping();
  if (map.date == null || map.label == null || (map.amount == null && map.debit == null && map.credit == null)) {
    state.tx = state.histBefore || []; recompute();
    $("#mapping").hidden = false; $("#mapping").open = true;
    setStatus("Je n'ai pas reconnu toutes les colonnes. Indiquez ci-dessous laquelle contient la date, le libellé et le montant, puis appuyez sur Appliquer.", "warn");
    return;
  }
  const { tx, skipped, plans } = buildTransactions(rows, headerIdx, map, invert);
  const head = headerIdx >= 0 ? rows[headerIdx].map(low).join("|") : "";
  const bank = state.fileBank || (/revolut|account.statement/i.test(state.file || "") || (/produit|product/.test(head) && /etat|state/.test(head)) ? "revolut" : "");
  tx.forEach(t => { if (!t.acct) t.acct = state.fileAcct || ""; if (bank) t.bank = bank; });
  if (plans.length && !state.sample) {
    const last = plans.reduce((a, b) => (b.date > a.date ? b : a));
    const prev = state.metas._revolut;
    if (!prev || last.date >= prev.date) { state.metas._revolut = { ...last, at: Date.now() }; store.set("metas", state.metas); }
  }
  if (!tx.length) { setStatus("Aucune opération valide trouvée avec ces colonnes. Corrigez la correspondance ci-dessous.", "crit"); $("#mapping").hidden = false; $("#mapping").open = true; if (!state.histBefore.length) { state.tx = []; recompute(); } return; }
  const merged = mergeHistory(state.histBefore, tx);
  state.tx = merged.tx;
  const negs = tx.filter(t => t.amount < 0).length;
  if (negs / tx.length < 0.2 && !invert && map.amount != null && state.fileAcct !== "epargne" && !tx.some(t => t.acct === "epargne")) {
    setStatus(`Presque toutes les opérations sont positives. Si vos dépenses apparaissent sans signe moins, cochez « Les dépenses sont en positif » ci-dessous.`, "warn");
    $("#mapping").hidden = false; $("#mapping").open = true;
  } else if (state.sample) {
    setStatus("");
  } else {
    const all = state.tx, d = x => new Date(x).toLocaleDateString("fr-FR");
    setStatus(`<b>${esc(state.file)}</b>${state.fileAcct === "epargne" ? " (compte d'épargne)" : ""} : ${tx.length} opération${tx.length > 1 ? "s" : ""} lue${tx.length > 1 ? "s" : ""}, <b>${merged.added} nouvelle${merged.added > 1 ? "s" : ""}</b>${merged.known ? `, ${merged.known} déjà connue${merged.known > 1 ? "s" : ""}` : ""}${skipped ? `, ${skipped} ligne${skipped > 1 ? "s" : ""} ignorée${skipped > 1 ? "s" : ""}` : ""}.<br>Historique : ${all.length} opérations du ${d(Math.min(...all.map(t => t.date)))} au ${d(Math.max(...all.map(t => t.date)))}.${state.pdfNote ? "<br>" + state.pdfNote : ""}${state.infoNote ? "<br>" + state.infoNote : ""}`, state.pdfNote ? "warn" : "");
  }
  if (!state.sample) { store.set("history", state.tx); state.lastImport = { file: state.file, added: merged.added }; }
  recompute();
}

// Ajoute un relevé à l'historique sans doublon : une opération (date, montant, libellé, compte)
// déjà connue n'est pas recomptée. Deux opérations identiques le même jour restent deux :
// on garde le plus grand nombre d'exemplaires vus dans un même relevé.
function mergeHistory(hist, fresh) {
  const k = t => [t.date, t.amount.toFixed(2), t.acct === "epargne" ? (t.cat === "interets" || /INTERET|INTEREST/.test(norm(t.label)) ? "I" : "M") : norm(t.label), t.acct || ""].join("|");
  const have = {};
  for (const t of hist) have[k(t)] = (have[k(t)] || 0) + 1;
  const seen = {}; let added = 0, known = 0; const out = hist.map(t => ({ ...t }));
  for (const t of fresh) {
    const key = k(t); seen[key] = (seen[key] || 0) + 1;
    if (seen[key] > (have[key] || 0)) { out.push(t); added++; } else known++;
  }
  out.sort((a, b) => b.date - a.date);
  return { tx: out, added, known };
}

function renderMapping() {
  const { rows, headerIdx, map } = state;
  const header = headerIdx >= 0 ? rows[headerIdx] : rows[0].map((_, i) => "Colonne " + (i + 1));
  const sample = rows[headerIdx + 1] || [];
  const opts = sel => `<option value="">—</option>` + header.map((h, i) => `<option value="${i}"${sel === i ? " selected" : ""}>${esc(h || "Colonne " + (i + 1))}${sample[i] ? " · " + esc(sample[i].slice(0, 18)) : ""}</option>`).join("");
  $("#map-grid").innerHTML = FIELDS.map(f => `<label for="map-${f.key}">${f.label}${f.need ? " *" : ""}<select id="map-${f.key}" data-k="${f.key}">${opts(map[f.key])}</select></label>`).join("");
  $("#invert").checked = !!state.invert;
}

// Budgets d'exemple, affichés seulement avec le relevé fictif tant qu'aucun budget n'est enregistré.
const DEMO_BUDGETS = { courses: 520, restaurants: 110, livraison: 70, shopping: 200, tabac: 40, loisirs: 30, transport: 140, abonnements: 45 };
const monthKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const budgetsDemo = () => state.sample && !Object.keys(state.budgets).length;
const activeBudgets = () => (budgetsDemo() ? DEMO_BUDGETS : state.budgets);

// État d'un budget pour un mois : dépensé, projection de fin de mois si le mois est en cours, niveau d'alerte.
function budgetRows(r, month) {
  const B = activeBudgets(), out = [];
  const [y, m] = month.split("-").map(Number);
  const daysIn = new Date(y, m, 0).getDate();
  const partial = monthKey(r.to) === month && r.to.getDate() < daysIn && r.from <= new Date(y, m - 1, 1, 23);
  for (const [cat, budget] of Object.entries(B)) {
    if (!CAT[cat] || !(budget > 0)) continue;
    const spent = Math.max(0, (r.byCatMonth[cat] || {})[month] || 0);
    const proj = partial ? spent * daysIn / r.to.getDate() : spent;
    const ratio = spent / budget;
    let tone = "good", note = `Reste ${eur.format(budget - spent)}`;
    if (spent > budget) { tone = "crit"; note = `Dépassé de ${eur.format(spent - budget)}`; }
    else if (partial && proj > budget * 1.02) { tone = "warn"; note = `Au rythme actuel : ${eur.format(proj)} en fin de mois`; }
    else if (ratio >= 0.8) { tone = "warn"; note = `${pct(ratio)} du budget utilisé`; }
    out.push({ cat, budget, spent, proj, ratio, tone, note, partial });
  }
  const order = { crit: 0, warn: 1, good: 2 };
  return out.sort((a, b) => order[a.tone] - order[b.tone] || b.ratio - a.ratio);
}
const budgetAlerts = (r, month) => budgetRows(r, month).filter(b => b.tone !== "good");

function budgetMonths(r) { return Object.keys(r.byMonth).sort().reverse(); }

// Proposition : moyenne mensuelle au centime près, et 20 % de moins pour les postes superflus.
function suggestBudgets(r) {
  const B = { ...activeBudgets() };
  for (const C of Object.values(r.byCat)) {
    if (C.total <= 0 || C.id === "autre" || B[C.id] > 0) continue;
    const base = C.monthly * (C.level === "sup" ? 0.8 : 1);
    if (base >= 5) B[C.id] = Math.round(base * 100) / 100;
  }
  return B;
}

function setBudget(cat, value) {
  if (budgetsDemo()) state.budgets = { ...DEMO_BUDGETS };
  if (value > 0) state.budgets[cat] = Math.round(value * 100) / 100; else delete state.budgets[cat];
  store.set("budgets", state.budgets);
}

/* ------------------------------ Accueil ------------------------------ */
// Revenus nets d'un mois : les revenus déclarés dans « Mon budget ». Un salaire versé en fin de
// mois (le 28, le 31…) sert à vivre le mois suivant : chaque versement est rattaché au mois qui
// commence dans les 7 jours qui suivent. Ainsi chaque mois reçoit un salaire, même quand il tombe
// le 31 ou le 2. Un mois qui en reçoit deux malgré tout est ramené à sa médiane ; dans le mois en
// cours, un revenu du début de mois (CAF…) pas encore arrivé est « attendu » tant que son jour
// habituel n'est pas passé.
const budgetMonth = d => monthKey(new Date(d + 7 * 864e5));
function monthIncome(r, k) {
  const P = state.profile;
  if (!P || !P.incomes.length) return { total: (r.byMonth[k] || {}).income || 0, parts: [], declared: false };
  const partial = k === monthKey(r.to) && r.to.getDate() < daysInMonth(k);
  const by = {}, lastDay = {};
  for (const t of state.tx) if (t.pf && t.amount > 0) { // tout l'historique : le salaire du 30 du mois d'avant compte
    const m = by[t.pf] || (by[t.pf] = {}), bk = budgetMonth(t.date); m[bk] = (m[bk] || 0) + t.amount;
    lastDay[t.pf] = new Date(t.date).getDate();
  }
  const parts = []; let total = 0;
  for (const x of P.incomes) {
    if (x.end && k > x.end) continue;
    const bm = by[x.id] || {}, keys = Object.keys(bm).sort(), vals = keys.map(m => bm[m]);
    if (!keys.length && !(x.manual > 0)) continue;
    if (keys.length && k < keys[0] && !(x.manual > 0)) continue;
    let v = bm[k] || 0, st = "";
    if (x.manual > 0) { v = x.manual; st = "montant saisi"; }
    else if (vals.length >= 3 && v > 1.5 * median(vals)) { v = median(vals); st = "versé 2 fois, compté 1"; }
    else if (!v && partial && lastDay[x.id] < 24 && lastDay[x.id] >= r.to.getDate()) { v = median(vals); st = "attendu"; }
    else if (!v) st = "pas reçu pour ce mois";
    parts.push({ label: x.label || "Revenu", v, st }); total += v;
  }
  return { total, parts, declared: true, partial };
}
// Autres entrées d'argent du mois (virements de proches, remboursements, retraits d'épargne…) :
// ce sont elles, ou l'argent déjà sur le compte, qui couvrent des dépenses supérieures aux revenus.
function monthOtherIn(r, k) {
  let v = 0;
  for (const t of r.txs || []) if (t.amount > 0 && !t.pf && monthKey(new Date(t.date)) === k) v += t.amount;
  return v;
}

function vHome(r) {
  if (r.onlySavings) return savingsCard(r, true);
  const months = Object.keys(r.byMonth).sort().reverse().slice(0, 12);
  if (!months.includes(state.month)) state.month = months[0];
  const k = state.month, M = r.byMonth[k] || { ess: 0, uti: 0, sup: 0 };
  // Le compte ne peut pas être à découvert : le reste à vivre ne descend pas sous 0. Un dépassement
  // a forcément été payé par d'autres entrées d'argent ou par ce qui restait sur le compte.
  const inc = monthIncome(r, k), spent = M.ess + M.uti + M.sup, left = inc.total - spent, other = inc.declared ? monthOtherIn(r, k) : 0;
  const partial = k === monthKey(r.to) && r.to.getDate() < daysInMonth(k);
  const ratio = inc.total > 0 ? spent / inc.total : 1;
  const hero = `<section class="hero" aria-labelledby="h-left">
    <div class="card-head" style="align-items:center"><span class="eyebrow" id="h-left">Reste à vivre · ${monthName(k)}</span>${partial ? `<span class="tag">au ${dayFmt(r.to)}</span>` : ""}</div>
    <p class="hero-big">${eur.format(Math.max(0, left))}</p>
    ${left < 0 ? `<p class="hero-sub">Dépenses supérieures aux revenus de <b style="color:var(--hero-ink)">${eur.format(-left)}</b>, payées ${other > 0 ? `par d'autres entrées d'argent (${eur.format(other)} ce mois-ci : proches, remboursements, épargne) et ` : ""}par l'argent qui restait sur le compte.</p>` : ""}
    <div class="meter${ratio > 1 ? " over" : ""}" role="img" aria-label="Dépenses : ${pct(ratio)} des revenus"><span style="width:${Math.min(100, ratio * 100)}%"></span></div>
    <div class="hero-split">
      <div><span class="v">${eur.format(inc.total)}</span><span class="l">${inc.declared ? "Revenus nets" : "Entrées d'argent"}</span></div>
      <div><span class="v">${eur.format(spent)}</span><span class="l">Dépenses (${pct(ratio)})</span></div>
    </div>
    ${inc.parts.length ? `<div class="parts">${inc.parts.map(p => `<div><span>${esc(p.label)}${p.st ? `<span class="tag">${p.st}</span>` : ""}</span><b class="num">${eur2.format(p.v)}</b></div>`).join("")}</div>` : ""}
  </section>`;
  const chips = months.length > 1 ? `<div class="months" role="group" aria-label="Choisir le mois">${months.map(m => `<button class="chip-btn" type="button" data-month="${m}" aria-pressed="${m === k}">${monthLabel(m)}</button>`).join("")}</div>` : "";
  return chips + hero + incomeSetupCard(r) + alertsCard(r, k) + monthSpendCard(r, k, M, spent) + adviceTeaser(r) + askCard() + upcomingCard(r) + trendCard(r);
}

    <div class="split" role="img" aria-label="Essentiel ${eur.format(M.ess)}, utile ${eur.format(M.uti)}, superflu ${eur.format(M.sup)}">${["ess", "uti", "sup"].map(l => M[l] > 0 ? `<span style="width:${M[l] / spent * 100}%;background:var(--${l})"></span>` : "").join("")}</div>
