<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; background: #eef2f5; }
        .leaflet-container { background: #cfe3ee; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="leaflet/leaflet.js"></script>
    <script src="leaflet/world_data.js"></script>
    <script>
        var map = L.map('map', { minZoom: 2, maxZoom: 8, worldCopyJump: true }).setView([15, 20], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 8,
            minZoom: 2
        }).addTo(map);

        var defaultStyle = { color: '#8a6d1f', weight: 1, fillColor: '#d4af37', fillOpacity: 0.12 };
        var selectedStyle = { color: '#8a6d1f', weight: 2, fillColor: '#d4af37', fillOpacity: 0.65 };

        var selectedLayer = null;

        var countriesLayer = L.geoJSON(WORLD_GEOJSON, {
            style: function () { return defaultStyle; },
            onEachFeature: function (feature, layer) {
                layer.on('click', function () {
                    if (selectedLayer) {
                        selectedLayer.setStyle(defaultStyle);
                    }
                    layer.setStyle(selectedStyle);
                    selectedLayer = layer;
                    if (window.Android && window.Android.onCountrySelected) {
                        window.Android.onCountrySelected(feature.properties.key);
                    }
                });
            }
        }).addTo(map);
    </script>
</body>
</html>
